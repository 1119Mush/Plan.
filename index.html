<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyPlanner 3.0 — 完整 DSE 科目 × 月曆 × 測驗</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --primary:#6366f1; --primary-dark:#4f46e5;
    --danger:#ef4444; --warn:#f59e0b; --ok:#10b981;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;padding:16px 14px 80px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0 10px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;}
  .brand .logo{
    width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:grid;place-items:center;color:#fff;font-size:16px;
  }
  .today-label{font-size:13px;color:var(--muted);font-weight:500;}

  nav.tabs{
    display:flex;gap:6px;background:#e2e8f0;padding:5px;border-radius:14px;margin-bottom:16px;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;min-width:70px;border:0;background:transparent;padding:9px 8px;border-radius:10px;
    font-size:13px;font-weight:600;color:#475569;cursor:pointer;transition:.15s;white-space:nowrap;
    font-family:inherit;
  }
  nav.tabs button.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card h2{
    font-size:15px;margin:0 0 14px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .badge{
    font-size:11px;font-weight:700;background:#eef2ff;color:var(--primary-dark);
    padding:2px 8px;border-radius:20px;
  }

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;}
  .stat{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px;}
  .stat .v{font-size:19px;font-weight:800;}
  .stat .k{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}

  .banner{
    border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;
    display:flex;gap:10px;align-items:flex-start;line-height:1.5;
  }
  .banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
  .banner.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;}

  .tl-row{
    display:grid;grid-template-columns:64px 10px 1fr auto;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px solid #f1f5f9;
  }
  .tl-row:last-child{border-bottom:0;}
  .tl-time{font-size:12px;font-variant-numeric:tabular-nums;color:#475569;font-weight:600;line-height:1.25;}
  .tl-time span{display:block;font-weight:400;color:#94a3b8;font-size:11px;}
  .tl-dot{width:10px;height:10px;border-radius:50%;}
  .tl-body{min-width:0;}
  .tl-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-sub{font-size:11.5px;color:var(--muted);}
  .tl-dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tl-row.study .tl-title{color:var(--primary-dark);}

  label.fld{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px;}
  input[type=text],input[type=date],input[type=number],input[type=time],select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  input:focus,select:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  button.primary{
    background:var(--primary);color:#fff;border:0;padding:11px 20px;border-radius:11px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  button.primary:hover{background:var(--primary-dark);}
  button.ghost{
    background:#fff;border:1px solid var(--border);color:#475569;padding:9px 16px;
    border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  button.ghost:hover{background:#f8fafc;}
  button.ghost.sm{padding:6px 12px;font-size:12.5px;border-radius:8px;}
  button.danger-sm{
    background:transparent;border:0;color:#94a3b8;cursor:pointer;font-size:15px;
    padding:4px 8px;border-radius:8px;font-family:inherit;line-height:1;
  }
  button.danger-sm:hover{background:#fef2f2;color:var(--danger);}

  .segmented{display:flex;gap:6px;}
  .segmented button{
    flex:1;padding:9px;border:1px solid var(--border);background:#fff;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;color:#475569;font-family:inherit;
  }
  .segmented button.on{background:var(--primary);border-color:var(--primary);color:#fff;}

  .topic-block{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .topic-label{
    display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;
    cursor:pointer;font-size:13.5px;font-weight:600;
  }
  .topic-label input{margin:0;width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
  .item-list{padding:4px 0;}
  .item-check{
    display:flex;align-items:center;gap:9px;padding:7px 12px 7px 34px;font-size:13px;
    cursor:pointer;
  }
  .item-check:hover{background:#f8fafc;}
  .item-check input{margin:0;width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
  .item-check .muted{margin-left:auto;font-size:11.5px;color:#94a3b8;}

  .preview{
    background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:12px 14px;
    font-size:13px;color:#3730a3;line-height:1.7;margin-top:4px;
  }
  .preview .big{font-size:16px;font-weight:800;}

  .quiz-item{
    display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f1f5f9;
  }
  .quiz-item:last-child{border-bottom:0;}
  .quiz-item .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .quiz-item .meta{flex:1;min-width:0;}
  .quiz-item .t{font-size:14px;font-weight:600;}
  .quiz-item .s{font-size:12px;color:var(--muted);}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .pill.urgent{background:#fef2f2;color:#b91c1c;}
  .pill.soon{background:#fffbeb;color:#b45309;}
  .pill.later{background:#f0fdf4;color:#15803d;}

  .subj-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .subj-head .dot{width:12px;height:12px;border-radius:50%;}
  .subj-head .nm{font-weight:700;font-size:15px;}
  .subj-head .ex{margin-left:auto;font-size:12px;color:var(--muted);}

  .topic-group{margin:10px 0 4px;}
  .topic-group .th{
    font-size:12px;font-weight:700;color:#64748b;letter-spacing:.5px;
    margin-bottom:6px;display:flex;align-items:center;gap:6px;
  }
  .item-row{
    display:grid;grid-template-columns:1fr 84px 1fr 70px 28px;gap:10px;align-items:center;
    padding:6px 0;font-size:13px;
  }
  .item-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-row input[type=number]{padding:5px 8px;font-size:12.5px;}
  .item-row .rem{font-size:11.5px;color:var(--muted);text-align:right;}
  @media(max-width:640px){
    .item-row{grid-template-columns:1fr 1fr 28px;gap:6px;}
    .item-row .nm{grid-column:1/-1;}
    .item-row .rem{grid-column:2;text-align:right;}
    .item-row .range-cell{grid-column:1/-1;}
  }

  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .mt12{margin-top:12px;}
  .rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .empty{text-align:center;padding:26px;color:#94a3b8;font-size:13.5px;}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .cal-title{font-weight:700;font-size:16px;flex:1;text-align:center;}
  .cal-weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    margin-bottom:6px;font-size:11px;font-weight:700;color:#94a3b8;text-align:center;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{
    min-height:62px;padding:6px;border-radius:10px;background:#f8fafc;
    border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;
    gap:4px;
  }
  .cal-cell:hover{background:#eef2ff;}
  .cal-cell.empty{background:transparent;cursor:default;}
  .cal-cell.today{background:#eef2ff;border-color:var(--primary);}
  .cal-cell.sel{box-shadow:inset 0 0 0 2px var(--primary);}
  .cal-day{font-size:13px;font-weight:600;}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}

  .section-label{
    font-size:11.5px;font-weight:700;color:#64748b;text-transform:uppercase;
    letter-spacing:.5px;margin:14px 0 8px;
  }
  .event-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .event-add input[type=text]{flex:1;min-width:140px;}
  .event-add input[type=time]{width:100px;}
  .event-item{
    display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #f1f5f9;
  }
  .event-item:last-child{border-bottom:0;}
  .event-meta{flex:1;min-width:0;}
  .event-title{font-size:13.5px;font-weight:600;}

  .palette{display:flex;gap:8px;flex-wrap:wrap;}
  .palette-btn{
    width:32px;height:32px;border-radius:50%;border:3px solid transparent;
    cursor:pointer;
  }
  .palette-btn.on{border-color:#0f172a;transform:scale(1.08);}

  .add-row{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .add-row input{flex:1;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">▦</div>
      <div>
        <div>StudyPlanner</div>
        <div class="today-label" id="todayLabel"></div>
      </div>
    </div>
    <span class="pill soon" id="examCountdown">—</span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="calendar" class="active">月曆</button>
    <button data-tab="today">今日</button>
    <button data-tab="quizzes">測驗</button>
    <button data-tab="subjects">科目</button>
    <button data-tab="settings">設定</button>
  </nav>

  <main id="view"></main>
</div>

<script>
/* =========================================================
   工具
   ========================================================= */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr = () => fmtDate(new Date());
const parseDate = s => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const weekdayOf = s => parseDate(s).getDay();
const toMin  = s => { const [h,m] = s.split(':').map(Number); return h*60 + m; };
const toTime = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
const WD = ['日','一','二','三','四','五','六'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   狀態
   ========================================================= */
const STORAGE_KEY = 'studyplanner.v3';
const PALETTE = ['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6'];

function buildSubjectFromDB(key){
  const db = DSE_DB[key];
  if (!db) return null;
  return {
    id: key,
    name: db.name,
    color: db.color,
    examDate: db.examDate,
    topics: db.topics.map((tp, ti) => ({
      id: `${key}.tp${ti}`,
      name: tp.name,
      items: tp.items.map((name, ii) => ({
        id: `${key}.tp${ti}.it${ii}`,
        name,
        estMin: 90,
        familiarity: 0
      }))
    }))
  };
}

function defaultState(){
  // 預設載入最常見嘅幾科，其餘用家可以喺「科目」自行加入
  const presetKeys = ['chinese','english','math_core','citizenship','physics','chemistry','biology','ict','m2'];
  const subjects = presetKeys.map(buildSubjectFromDB).filter(Boolean);

  return {
    settings: {
      schoolStart: '07:00', schoolEnd: '17:00',
      commuteHome: 45, windDown: 30, dinner: 45,
      bedtime: '23:00', weekendStart: '09:00',
      blockMin: 30, breakMin: 10,
      timeFormat: 'minute', maxSubjectsPerDay: 3
    },
    subjects,
    quizzes: [],
    events: []
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.settings || !Array.isArray(s.subjects)) return null;
    if (!Array.isArray(s.quizzes)) s.quizzes = [];
    if (!Array.isArray(s.events)) s.events = [];
    if (s.settings.timeFormat === undefined) s.settings.timeFormat = 'minute';
    if (s.settings.maxSubjectsPerDay === undefined) s.settings.maxSubjectsPerDay = 3;
    return s;
  }catch(e){ return null; }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

let state = loadState() || defaultState();
let activeTab = 'calendar';
let calendarYM = todayStr().slice(0, 7);
let selectedDate = todayStr();
let draft = null;
let newSubjectColor = PALETTE[0];

function newDraft(){
  const first = state.subjects[0];
  return { subjectId: first ? first.id : '', date: addDays(todayStr(), 7), title: '', difficulty: 2, itemIds: new Set() };
}

/* =========================================================
   查詢工具
   ========================================================= */
const findSubject = id => state.subjects.find(s => s.id === id);
const findTopic = topicId => {
  for (const subj of state.subjects)
    for (const tp of subj.topics)
      if (tp.id === topicId) return { subj, tp };
  return null;
};
const itemRemainingMin = it => Math.max(0, Math.round(it.estMin * (1 - (it.familiarity ?? 0))));
const subjectRemainingMin = subj => subj.topics.reduce((a, tp) => a + tp.items.reduce((b, it) => b + itemRemainingMin(it), 0), 0);

function fmtDur(min){
  min = Math.round(min);
  if (state.settings.timeFormat === 'hour') return (min / 60).toFixed(1).replace(/\.0$/, '') + ' 小時';
  if (min < 60) return min + ' 分';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} 小時 ${m} 分` : `${h} 小時`;
}

/* =========================================================
   測驗計算
   ========================================================= */
function quizRequiredMin(quiz){
  const subj = findSubject(quiz.subjectId);
  if (!subj) return 0;
  const mult = ({1:1.0, 2:1.15, 3:1.35})[quiz.difficulty] ?? 1.0;
  const want = new Set(quiz.itemIds || []);
  let total = 0;
  for (const tp of subj.topics){
    const sel = (quiz.topicIds || []).includes(tp.id);
    for (const it of tp.items){
      if (want.size ? want.has(it.id) : sel) total += itemRemainingMin(it) * mult;
    }
  }
  return Math.round(total / 5) * 5;
}

function nearestUpcomingQuiz(dateStr, subjectId){
  let best = null;
  for (const q of state.quizzes){
    if (q.status !== 'planned' || q.subjectId !== subjectId) continue;
    const d = daysBetween(dateStr, q.date);
    if (d < 0) continue;
    if (!best || q.date < best.date) best = q;
  }
  return best;
}

function subjectDayCap(dateStr, subjectId){
  let cap = Infinity;
  for (const q of state.quizzes){
    if (q.status !== 'planned' || q.subjectId !== subjectId) continue;
    const d = daysBetween(dateStr, q.date);
    if (d === 0) return 0;
    if (d === 1) cap = Math.min(cap, 90);
  }
  return cap;
}

function subjectDemand(dateStr, subjectId){
  let demand = 0;
  for (const q of state.quizzes){
    if (q.status !== 'planned' || q.subjectId !== subjectId) continue;
    const d = daysBetween(dateStr, q.date);
    if (d < 0 || d > 14) continue;
    demand = Math.max(demand, Math.ceil(quizRequiredMin(q) / Math.max(1, d)));
  }
  const subj = findSubject(subjectId);
  if (subj){
    const days = daysBetween(dateStr, subj.examDate);
    const need = subjectRemainingMin(subj);
    if (days >= 0 && need > 0) demand = Math.max(demand, Math.max(30, Math.ceil(need / Math.max(1, days))));
  }
  return demand;
}

/* =========================================================
   每日時間窗
   ========================================================= */
function dayBlocks(dateStr){
  const s = state.settings;
  const wd = weekdayOf(dateStr);
  const isSchool = wd >= 1 && wd <= 5;
  const dayStart = isSchool ? toMin(s.schoolEnd) : toMin(s.weekendStart);
  const dayEnd = toMin(s.bedtime);
  const fixed = [];

  if (isSchool){
    let cur = toMin(s.schoolEnd);
    const ce = cur + Number(s.commuteHome);
    if (Number(s.commuteHome) > 0) fixed.push({ start: cur, end: ce, label: '通勤', kind: 'buffer' });
    cur = ce;
    const we = cur + Number(s.windDown);
    if (Number(s.windDown) > 0) fixed.push({ start: cur, end: we, label: '休息 / 緩衝', kind: 'buffer' });
    cur = we;
    const de = cur + Number(s.dinner);
    if (Number(s.dinner) > 0) fixed.push({ start: cur, end: de, label: '晚餐', kind: 'buffer' });
  }

  for (const ev of state.events){
    if (ev.date === dateStr && ev.start && ev.end)
      fixed.push({ start: toMin(ev.start), end: toMin(ev.end), label: ev.title, kind: 'event' });
  }
  fixed.sort((a, b) => a.start - b.start);

  const free = [];
  let cursor = dayStart;
  for (const b of fixed){
    if (b.end <= dayStart) continue;
    if (b.start >= dayEnd) break;
    const bs = Math.max(b.start, dayStart);
    if (bs > cursor && Math.min(bs, dayEnd) - cursor >= 15) free.push({ start: cursor, end: Math.min(bs, dayEnd) });
    cursor = Math.max(cursor, b.end);
  }
  if (cursor < dayEnd) free.push({ start: cursor, end: dayEnd });
  return { fixed, free, dayStart, dayEnd };
}

/* =========================================================
   排程
   ========================================================= */
function buildPlan(dateStr){
  const { fixed, free } = dayBlocks(dateStr);
  const demands = {};
  for (const subj of state.subjects){
    const d = subjectDemand(dateStr, subj.id);
    if (d > 0) demands[subj.id] = d;
  }

  const allocated = {};
  const used = new Set();
  const maxSubj = Number(state.settings.maxSubjectsPerDay) || 99;
  const blocks = [];
  const BLOCK = Number(state.settings.blockMin) || 30;
  const BRK = Number(state.settings.breakMin) || 0;

  for (const iv of free){
    let cursor = iv.start;
    while (cursor + 15 <= iv.end){
      let best = null, bestScore = 0;
      for (const id in demands){
        if (used.size >= maxSubj && !used.has(id)) continue;
        const cap = subjectDayCap(dateStr, id);
        const rem = demands[id] - (allocated[id] || 0);
        if (rem <= 0 || (allocated[id] || 0) >= cap) continue;
        let score = rem;
        const q = nearestUpcomingQuiz(dateStr, id);
        if (q){
          const d = daysBetween(dateStr, q.date);
          if (d <= 1) score *= 3; else if (d <= 3) score *= 1.8; else if (d <= 7) score *= 1.3;
        }
        if (score > bestScore){ bestScore = score; best = id; }
      }
      if (!best) break;
      const len = Math.min(BLOCK, iv.end - cursor);
      if (len < 15) break;
      blocks.push({ start: cursor, end: cursor + len, subjectId: best });
      allocated[best] = (allocated[best] || 0) + len;
      used.add(best);
      cursor += len;
      if (cursor + BRK <= iv.end) cursor += BRK; else break;
    }
  }
  return { blocks, fixed, free };
}

/* =========================================================
   視圖：月曆
   ========================================================= */
function viewCalendar(){
  const [y, m] = calendarYM.split('-').map(Number);
  const firstDay = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, date: `${y}-${pad2(m)}-${pad2(d)}` });
  while (cells.length % 7 !== 0) cells.push({ empty: true });

  const today = todayStr();
  const gridHtml = cells.map(c => {
    if (c.empty) return '<div class="cal-cell empty"></div>';
    const quizzes = state.quizzes.filter(q => q.status === 'planned' && q.date === c.date);
    const events = state.events.filter(e => e.date === c.date);
    const dots = [];
    quizzes.slice(0, 2).forEach(q => { const s = findSubject(q.subjectId); dots.push(`<span class="cal-dot" style="background:${s ? s.color : '#94a3b8'}"></span>`); });
    events.slice(0, 2).forEach(() => dots.push('<span class="cal-dot" style="background:#f59e0b"></span>'));
    return `<div class="cal-cell ${c.date === today ? 'today' : ''} ${c.date === selectedDate ? 'sel' : ''}" data-cal-date="${c.date}">
      <div class="cal-day">${c.day}</div><div class="cal-dots">${dots.join('')}</div>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="cal-head">
        <button class="ghost sm" data-cal-nav="-1">‹</button>
        <div class="cal-title">${y} 年 ${m} 月</div>
        <button class="ghost sm" data-cal-nav="1">›</button>
        <button class="ghost sm" data-cal-today>今天</button>
      </div>
      <div class="cal-weekdays">${['日','一','二','三','四','五','六'].map(w => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${gridHtml}</div>
      <div class="small muted mt12">● 測驗　● 特別安排</div>
    </div>
    <div class="card">
      <h2>${selectedDate} · 星期${WD[weekdayOf(selectedDate)]}</h2>
      ${calendarDetailHtml(selectedDate)}
    </div>
  `;
}

function calendarDetailHtml(dateStr){
  const quizzes = state.quizzes.filter(q => q.status === 'planned' && q.date === dateStr);
  const { fixed } = dayBlocks(dateStr);
  const { blocks } = buildPlan(dateStr);
  let html = '';

  if (quizzes.length){
    html += `<div class="section-label">測驗</div>`;
    for (const q of quizzes){
      const s = findSubject(q.subjectId);
      html += `<div class="quiz-item"><div class="dot" style="background:${s ? s.color : '#94a3b8'}"></div>
        <div class="meta"><div class="t">${esc(q.title || (s ? s.name + ' 測驗' : '測驗'))}</div>
        <div class="s">需時 ${fmtDur(quizRequiredMin(q))}</div></div><span class="pill urgent">今日</span></div>`;
    }
  }

  html += `<div class="section-label">日程</div>`;
  const entries = [...fixed, ...blocks.map(b => ({ ...b, kind: 'study' }))].sort((a, b) => a.start - b.start);
  if (!entries.length) html += '<div class="empty">今日冇特別安排</div>';
  else for (const e of entries){
    if (e.kind === 'study'){
      const s = findSubject(e.subjectId);
      html += `<div class="tl-row study"><div class="tl-time">${toTime(e.start)}<span>${toTime(e.end)}</span></div>
        <div class="tl-dot" style="background:${s ? s.color : '#94a3b8'}"></div>
        <div class="tl-body"><div class="tl-title">${esc(s ? s.name : '？')}</div></div>
        <div class="tl-dur">${fmtDur(e.end - e.start)}</div></div>`;
    } else {
      html += `<div class="tl-row ${e.kind}"><div class="tl-time">${toTime(e.start)}<span>${toTime(e.end)}</span></div>
        <div class="tl-dot" style="background:${e.kind === 'event' ? '#f59e0b' : '#cbd5e1'}"></div>
        <div class="tl-body"><div class="tl-title">${esc(e.label)}</div></div>
        <div class="tl-dur">${fmtDur(e.end - e.start)}</div></div>`;
    }
  }

  html += eventSectionHtml(dateStr);
  return html;
}

function eventSectionHtml(dateStr){
  const events = state.events.filter(e => e.date === dateStr);
  return `
    <div class="mt12">
      <div class="section-label">＋ 加入特別安排（會扣減溫習時間）</div>
      <div class="event-add">
        <input type="text" data-ev-title="${dateStr}" placeholder="事件名稱（例如：家庭聚會）">
        <input type="time" data-ev-start="${dateStr}">
        <span class="small muted">至</span>
        <input type="time" data-ev-end="${dateStr}">
        <button class="ghost sm" data-action="add-event" data-date="${dateStr}">加入</button>
      </div>
      ${events.length ? events.map(ev => `
        <div class="event-item"><div class="event-meta"><div class="event-title">${esc(ev.title)}</div>
          <div class="small muted">${ev.start && ev.end ? `${ev.start}–${ev.end}` : '全日備註'}</div></div>
          <button class="danger-sm" data-action="del-event" data-id="${ev.id}">✕</button></div>
      `).join('') : ''}
    </div>
  `;
}

/* =========================================================
   視圖：今日
   ========================================================= */
function viewToday(){
  const date = todayStr();
  const { fixed, free } = dayBlocks(date);
  const { blocks } = buildPlan(date);
  const available = free.reduce((a, f) => a + (f.end - f.start), 0);
  const planned = blocks.reduce((a, b) => a + (b.end - b.start), 0);
  const entries = [...fixed, ...blocks.map(b => ({ ...b, kind: 'study' }))].sort((a, b) => a.start - b.start);

  const rows = entries.map(e => {
    if (e.kind === 'study'){
      const subj = findSubject(e.subjectId);
      const q = nearestUpcomingQuiz(date, e.subjectId);
      const dLeft = q ? daysBetween(date, q.date) : null;
      return `<div class="tl-row study"><div class="tl-time">${toTime(e.start)}<span>${toTime(e.end)}</span></div>
        <div class="tl-dot" style="background:${subj ? subj.color : '#94a3b8'}"></div>
        <div class="tl-body"><div class="tl-title">${esc(subj ? subj.name : '？')}</div>
        <div class="tl-sub">${q && dLeft <= 14 ? '⚡ 測驗衝刺 · 距測驗 ' + dLeft + ' 天' : 'DSE 溫習'}</div></div>
        <div class="tl-dur">${fmtDur(e.end - e.start)}</div></div>`;
    }
    return `<div class="tl-row ${e.kind}"><div class="tl-time">${toTime(e.start)}<span>${toTime(e.end)}</span></div>
      <div class="tl-dot" style="background:${e.kind === 'event' ? '#f59e0b' : '#cbd5e1'}"></div>
      <div class="tl-body"><div class="tl-title">${esc(e.label)}</div></div>
      <div class="tl-dur">${fmtDur(e.end - e.start)}</div></div>`;
  }).join('');

  const upcoming = state.quizzes.filter(q => q.status === 'planned' && daysBetween(date, q.date) >= 0 && daysBetween(date, q.date) <= 14).sort((a, b) => a.date < b.date ? -1 : 1);
  const upcomingHtml = upcoming.length ? upcoming.map(q => {
    const subj = findSubject(q.subjectId);
    const d = daysBetween(date, q.date);
    const need = quizRequiredMin(q);
    return `<div class="quiz-item"><div class="dot" style="background:${subj ? subj.color : '#94a3b8'}"></div>
      <div class="meta"><div class="t">${esc(q.title || (subj ? subj.name + ' 測驗' : '測驗'))}</div>
      <div class="s">${q.date} · 需時 ${fmtDur(need)}</div></div>
      <span class="pill ${d <= 3 ? 'urgent' : d <= 7 ? 'soon' : 'later'}">${d === 0 ? '今日' : d + ' 天'}</span></div>`;
  }).join('') : '<div class="empty">未來 14 日未有測驗</div>';

  return `
    <div class="card">
      <h2>今日總覽</h2>
      <div class="stats">
        <div class="stat"><div class="v">${fmtDur(available)}</div><div class="k">放學後可用</div></div>
        <div class="stat"><div class="v">${fmtDur(planned)}</div><div class="k">已排溫習</div></div>
        <div class="stat"><div class="v">${fmtDur(Math.max(0, available - planned))}</div><div class="k">剩餘緩衝</div></div>
        <div class="stat"><div class="v">${upcoming.length}</div><div class="k">14 日內測驗</div></div>
      </div>
      <div class="small muted mt12">每日最多 ${state.settings.maxSubjectsPerDay} 科 · 顯示：${state.settings.timeFormat === 'hour' ? '小時' : '分鐘'}</div>
    </div>
    <div class="card">
      <h2>今日時間表 <span class="badge">${WD[weekdayOf(date)]}</span></h2>
      ${rows || '<div class="empty">今日冇排到溫習，好好休息 😌</div>'}
      ${eventSectionHtml(date)}
    </div>
    <div class="card"><h2>未來 14 日測驗</h2>${upcomingHtml}</div>
  `;
}

/* =========================================================
   視圖：測驗
   ========================================================= */
function viewQuizzes(){
  if (!draft) draft = newDraft();
  const subj = findSubject(draft.subjectId);
  const subjOptions = state.subjects.map(s => `<option value="${s.id}" ${s.id === draft.subjectId ? 'selected' : ''}>${esc(s.name)}</option>`).join('');

  let tree = '';
  if (subj){
    for (const tp of subj.topics){
      const selCount = tp.items.filter(it => draft.itemIds.has(it.id)).length;
      tree += `<div class="topic-block">
        <label class="topic-label"><input type="checkbox" data-quiz-topic="${tp.id}" ${selCount === tp.items.length && tp.items.length > 0 ? 'checked' : ''}>
          <span>${esc(tp.name)}</span><span class="muted" style="margin-left:auto;font-size:11.5px;">${selCount}/${tp.items.length}</span></label>
        <div class="item-list">${tp.items.map(it => `
          <label class="item-check"><input type="checkbox" data-quiz-item="${it.id}" ${draft.itemIds.has(it.id) ? 'checked' : ''}>
            <span>${esc(it.name)}</span><span class="muted">剩 ${fmtDur(itemRemainingMin(it))}</span></label>`).join('')}</div>
      </div>`;
    }
  } else tree = '<div class="empty">請先喺「科目」加入科目</div>';

  const list = state.quizzes.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const listHtml = list.length ? list.map(q => {
    const s = findSubject(q.subjectId);
    const d = daysBetween(todayStr(), q.date);
    return `<div class="quiz-item"><div class="dot" style="background:${s ? s.color : '#94a3b8'}"></div>
      <div class="meta"><div class="t">${esc(q.title || (s ? s.name + ' 測驗' : '測驗'))}</div>
      <div class="s">${esc(s ? s.name : '？')} · ${q.date} · 需時 ${fmtDur(quizRequiredMin(q))}</div></div>
      <span class="pill ${d < 0 ? 'done' : d <= 3 ? 'urgent' : d <= 7 ? 'soon' : 'later'}">${d < 0 ? '已過' : d === 0 ? '今日' : d + ' 天'}</span>
      <button class="danger-sm" data-action="del-quiz" data-id="${q.id}">✕</button></div>`;
  }).join('') : '<div class="empty">尚未加入任何測驗</div>';

  return `
    <div class="card">
      <h2>新增測驗</h2>
      <div class="grid2">
        <div><label class="fld">科目</label><select id="q-subject">${subjOptions}</select></div>
        <div><label class="fld">測驗日期</label><input type="date" id="q-date" value="${draft.date}"></div>
        <div><label class="fld">名稱（可選）</label><input type="text" id="q-title" value="${esc(draft.title)}" placeholder="例如 Physics Quiz"></div>
        <div><label class="fld">難度</label><div class="segmented" id="q-diff">
          <button data-d="1" class="${draft.difficulty === 1 ? 'on' : ''}">易</button>
          <button data-d="2" class="${draft.difficulty === 2 ? 'on' : ''}">中</button>
          <button data-d="3" class="${draft.difficulty === 3 ? 'on' : ''}">難</button>
        </div></div>
      </div>
      <div class="mt12"><label class="fld">測驗範圍（可多選課題 / 細項）</label>${tree}</div>
      <div class="preview mt12" id="q-preview">${quizPreviewHtml()}</div>
      <div class="mt12 rowflex"><button class="primary" id="q-add">加入測驗</button>
        <span class="small muted">勾選課題會自動包含其下所有細項</span></div>
    </div>
    <div class="card"><h2>所有測驗 <span class="badge">${list.length}</span></h2>${listHtml}</div>
  `;
}

function quizPreviewHtml(){
  const subj = findSubject(draft.subjectId);
  if (!subj) return '<span class="muted">請選擇科目</span>';
  const items = [];
  for (const tp of subj.topics) for (const it of tp.items) if (draft.itemIds.has(it.id)) items.push(it);
  if (!items.length) return '<span class="muted">請勾選測驗範圍</span>';
  const mult = ({1:1.0, 2:1.15, 3:1.35})[draft.difficulty] ?? 1;
  const need = Math.round(items.reduce((a, it) => a + itemRemainingMin(it) * mult, 0) / 5) * 5;
  const days = Math.max(1, daysBetween(todayStr(), draft.date));
  return `<div><span class="big">${fmtDur(need)}</span> <span class="muted">估算需要</span></div>
    <div>距測驗 ${days} 日 → 平均每日 ${fmtDur(Math.ceil(need / days))}</div>
    <div class="muted">已選 ${items.length} 個細項</div>`;
}

/* =========================================================
   視圖：科目（簡化操作）
   ========================================================= */
function viewSubjects(){
  const cards = state.subjects.map(subj => {
    const remaining = subjectRemainingMin(subj);
    const dse = daysBetween(todayStr(), subj.examDate);
    const topicsHtml = subj.topics.map(tp => `
      <div class="topic-group">
        <div class="th"><span>${esc(tp.name)}</span>
          <button class="danger-sm" data-action="del-topic" data-subj="${subj.id}" data-topic="${tp.id}">✕</button></div>
        ${tp.items.map(it => `
          <div class="item-row">
            <div class="nm">${esc(it.name)}</div>
            <input type="number" min="0" step="10" value="${it.estMin}" data-est="${it.id}" title="預估分鐘">
            <div class="range-cell"><input type="range" min="0" max="100" step="5" value="${Math.round((it.familiarity || 0) * 100)}" data-fam="${it.id}" title="熟悉度"></div>
            <div class="rem" id="rem-${it.id}">剩 ${fmtDur(itemRemainingMin(it))}</div>
            <button class="danger-sm" data-action="del-item" data-subj="${subj.id}" data-topic="${tp.id}" data-item="${it.id}">✕</button>
          </div>`).join('')}
        <div class="add-row">
          <input type="text" data-new-item-name="${tp.id}" placeholder="新細項名稱">
          <input type="number" data-new-item-min="${tp.id}" placeholder="分鐘" style="width:80px;" value="90">
          <button class="ghost sm" data-action="add-item" data-subj="${subj.id}" data-topic="${tp.id}">＋</button>
        </div>
      </div>`).join('');

    return `<div class="card">
      <div class="subj-head"><div class="dot" style="background:${subj.color}"></div>
        <div class="nm">${esc(subj.name)}</div>
        <button class="danger-sm" data-action="del-subject" data-id="${subj.id}">✕</button></div>
      <div class="small muted">剩餘 ${fmtDur(remaining)} · DSE ${subj.examDate}（${dse >= 0 ? dse + ' 天' : '已過'}）</div>
      ${topicsHtml}
      <div class="add-row mt12">
        <input type="text" data-new-topic="${subj.id}" placeholder="新課題名稱">
        <button class="ghost sm" data-action="add-topic" data-subj="${subj.id}">＋ 課題</button>
      </div>
    </div>`;
  }).join('');

  // 從 DSE 數據庫快速加入科目
  const existingIds = new Set(state.subjects.map(s => s.id));
  const available = Object.entries(DSE_DB).filter(([key]) => !existingIds.has(key));
  const quickAdd = available.length ? `
    <div class="card">
      <h2>從 DSE 科目庫快速加入</h2>
      <div class="rowflex">
        ${available.map(([key, db]) => `<button class="ghost sm" data-action="add-from-db" data-key="${key}" style="border-color:${db.color}33;">＋ ${esc(db.name)}</button>`).join('')}
      </div>
      <div class="small muted mt12">內置全部甲類科目，包括 M2 同 ICT。加入後可自由增刪課題。</div>
    </div>` : '';

  const addForm = `
    <div class="card">
      <h2>自訂新科目</h2>
      <div class="grid2">
        <div><label class="fld">科目名稱</label><input type="text" id="new-subj-name" placeholder="例如 綜合科學"></div>
        <div><label class="fld">DSE 考試日期</label><input type="date" id="new-subj-date" value="${addDays(todayStr(), 180)}"></div>
      </div>
      <div class="mt12"><label class="fld">顏色</label><div class="palette" id="new-subj-color">
        ${PALETTE.map((c, i) => `<button class="palette-btn ${i === 0 ? 'on' : ''}" data-color="${c}" style="background:${c}"></button>`).join('')}
      </div></div>
      <div class="mt12"><button class="primary" id="add-subject">新增科目</button></div>
    </div>
  `;

  return quickAdd + addForm + cards;
}

/* =========================================================
   視圖：設定（簡化）
   ========================================================= */
function viewSettings(){
  const s = state.settings;
  return `
    <div class="card">
      <h2>上學與作息</h2>
      <div class="grid2">
        <div><label class="fld">上學時間</label><input type="time" data-setting="schoolStart" value="${s.schoolStart}"></div>
        <div><label class="fld">放學時間</label><input type="time" data-setting="schoolEnd" value="${s.schoolEnd}"></div>
        <div><label class="fld">通勤（分鐘）</label><input type="number" min="0" step="5" data-setting="commuteHome" value="${s.commuteHome}"></div>
        <div><label class="fld">返家緩衝（分鐘）</label><input type="number" min="0" step="5" data-setting="windDown" value="${s.windDown}"></div>
        <div><label class="fld">晚餐（分鐘）</label><input type="number" min="0" step="5" data-setting="dinner" value="${s.dinner}"></div>
        <div><label class="fld">最遲結束</label><input type="time" data-setting="bedtime" value="${s.bedtime}"></div>
        <div><label class="fld">週末開始</label><input type="time" data-setting="weekendStart" value="${s.weekendStart}"></div>
      </div>
    </div>
    <div class="card">
      <h2>排程偏好</h2>
      <div class="grid2">
        <div><label class="fld">學習區塊（分鐘）</label><input type="number" min="10" step="5" data-setting="blockMin" value="${s.blockMin}"></div>
        <div><label class="fld">區塊間休息（分鐘）</label><input type="number" min="0" step="5" data-setting="breakMin" value="${s.breakMin}"></div>
        <div><label class="fld">每日最多科目</label><select data-setting="maxSubjectsPerDay">
          ${[1,2,3,4,5].map(n => `<option value="${n}" ${s.maxSubjectsPerDay == n ? 'selected' : ''}>${n} 科</option>`).join('')}
        </select></div>
        <div><label class="fld">時間顯示</label><div class="segmented" id="time-format-toggle">
          <button data-tf="minute" class="${s.timeFormat === 'minute' ? 'on' : ''}">分鐘</button>
          <button data-tf="hour" class="${s.timeFormat === 'hour' ? 'on' : ''}">小時</button>
        </div></div>
      </div>
    </div>
    <div class="card"><h2>資料</h2><div class="rowflex">
      <button class="ghost" data-action="reset">重設為預設科目</button>
      <span class="small muted">資料只存喺你嘅瀏覽器。</span>
    </div></div>
  `;
}

/* =========================================================
   渲染
   ========================================================= */
const view = $('#view');

function render(){
  const now = new Date();
  $('#todayLabel').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${WD[now.getDay()]}`;

  let nearest = null;
  for (const s of state.subjects){
    const d = daysBetween(todayStr(), s.examDate);
    if (d >= 0 && (!nearest || d < nearest.d)) nearest = { s, d };
  }
  $('#examCountdown').textContent = nearest ? `DSE ${nearest.s.name} ${nearest.d} 天` : '未有 DSE 日期';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));

  if (activeTab === 'calendar')      view.innerHTML = viewCalendar();
  else if (activeTab === 'today')    view.innerHTML = viewToday();
  else if (activeTab === 'quizzes')  view.innerHTML = viewQuizzes();
  else if (activeTab === 'subjects') view.innerHTML = viewSubjects();
  else                               view.innerHTML = viewSettings();

  if (activeTab === 'quizzes') updateTopicCheckboxes();
  saveState();
}

function updateTopicCheckboxes(){
  if (!draft) return;
  const subj = findSubject(draft.subjectId);
  if (!subj) return;
  for (const tp of subj.topics){
    const cb = view.querySelector(`[data-quiz-topic="${tp.id}"]`);
    if (!cb) continue;
    const sel = tp.items.filter(it => draft.itemIds.has(it.id)).length;
    cb.indeterminate = sel > 0 && sel < tp.items.length;
    cb.checked = sel === tp.items.length && tp.items.length > 0;
  }
}

/* =========================================================
   事件
   ========================================================= */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  activeTab = b.dataset.tab;
  render();
});

view.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (btn){
    const action = btn.dataset.action;

    if (action === 'add-event'){
      const date = btn.dataset.date;
      const titleInput = view.querySelector(`[data-ev-title="${date}"]`);
      const startInput = view.querySelector(`[data-ev-start="${date}"]`);
      const endInput = view.querySelector(`[data-ev-end="${date}"]`);
      const title = titleInput ? titleInput.value.trim() : '';
      const start = startInput ? startInput.value : '';
      const end = endInput ? endInput.value : '';
      if (!title){ alert('請輸入事件名稱'); return; }
      if ((start && !end) || (!start && end)){ alert('請同時填寫開始和結束時間'); return; }
      state.events.push({ id: 'ev' + Date.now(), date, title, start: start || null, end: end || null });
      render(); return;
    }

    if (action === 'del-event'){ state.events = state.events.filter(ev => ev.id !== btn.dataset.id); render(); return; }
    if (action === 'del-quiz'){ state.quizzes = state.quizzes.filter(q => q.id !== btn.dataset.id); render(); return; }

    if (action === 'add-from-db'){
      const key = btn.dataset.key;
      const subj = buildSubjectFromDB(key);
      if (subj){ state.subjects.push(subj); render(); }
      return;
    }

    if (action === 'add-subject'){
      const nameInput = document.getElementById('new-subj-name');
      const dateInput = document.getElementById('new-subj-date');
      const colorBtn = document.querySelector('#new-subj-color .palette-btn.on');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name){ alert('請輸入科目名稱'); return; }
      state.subjects.push({
        id: 'subj' + Date.now(), name,
        color: colorBtn ? colorBtn.dataset.color : PALETTE[0],
        examDate: dateInput ? dateInput.value : addDays(todayStr(), 180),
        topics: []
      });
      render(); return;
    }

    if (action === 'del-subject'){
      if (!confirm('刪除此科目？相關測驗會一併移除。')) return;
      state.subjects = state.subjects.filter(s => s.id !== btn.dataset.id);
      state.quizzes = state.quizzes.filter(q => q.subjectId !== btn.dataset.id);
      render(); return;
    }

    if (action === 'add-topic'){
      const subj = findSubject(btn.dataset.subj);
      if (!subj) return;
      const input = view.querySelector(`[data-new-topic="${subj.id}"]`);
      const name = input ? input.value.trim() : '';
      if (!name){ alert('請輸入課題名稱'); return; }
      subj.topics.push({ id: 'tp' + Date.now(), name, items: [] });
      render(); return;
    }

    if (action === 'del-topic'){
      if (!confirm('刪除此課題？其下細項會一併移除。')) return;
      const subj = findSubject(btn.dataset.subj);
      if (subj) subj.topics = subj.topics.filter(t => t.id !== btn.dataset.topic);
      render(); return;
    }

    if (action === 'add-item'){
      const found = findTopic(btn.dataset.topic);
      if (!found) return;
      const nameInput = view.querySelector(`[data-new-item-name="${found.tp.id}"]`);
      const minInput = view.querySelector(`[data-new-item-min="${found.tp.id}"]`);
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name){ alert('請輸入細項名稱'); return; }
      found.tp.items.push({ id: 'it' + Date.now(), name, estMin: Number(minInput && minInput.value) || 90, familiarity: 0 });
      render(); return;
    }

    if (action === 'del-item'){
      const found = findTopic(btn.dataset.topic);
      if (found) found.tp.items = found.tp.items.filter(it => it.id !== btn.dataset.item);
      render(); return;
    }

    if (action === 'reset'){
      if (confirm('重設為預設科目？現有資料會清除。')){ state = defaultState(); draft = null; render(); }
      return;
    }
  }

  const nav = e.target.closest('[data-cal-nav]');
  if (nav){
    const [y, m] = calendarYM.split('-').map(Number);
    const d = new Date(y, m - 1 + Number(nav.dataset.calNav), 1);
    calendarYM = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    render(); return;
  }
  if (e.target.closest('[data-cal-today]')){ calendarYM = todayStr().slice(0, 7); selectedDate = todayStr(); render(); return; }
  const cell = e.target.closest('[data-cal-date]');
  if (cell){ selectedDate = cell.dataset.calDate; render(); return; }

  const pal = e.target.closest('.palette-btn');
  if (pal){
    document.querySelectorAll('#new-subj-color .palette-btn').forEach(b => b.classList.remove('on'));
    pal.classList.add('on'); return;
  }

  if (e.target.id === 'q-add'){
    const subj = findSubject(draft.subjectId);
    if (!subj) return;
    if (!draft.itemIds.size){ alert('請至少勾選一個測驗範圍'); return; }
    const topicIds = [];
    for (const tp of subj.topics) if (tp.items.some(it => draft.itemIds.has(it.id))) topicIds.push(tp.id);
    state.quizzes.push({
      id: 'q' + Date.now(), subjectId: draft.subjectId, date: draft.date,
      title: draft.title.trim() || (subj.name + ' Quiz'),
      difficulty: draft.difficulty, status: 'planned', topicIds, itemIds: [...draft.itemIds]
    });
    draft = newDraft(); render(); return;
  }

  const d = e.target.closest('#q-diff button');
  if (d){
    draft.difficulty = Number(d.dataset.d);
    document.querySelectorAll('#q-diff button').forEach(b => b.classList.toggle('on', b === d));
    updateQuizPreview(); return;
  }

  const tf = e.target.closest('#time-format-toggle button');
  if (tf){ state.settings.timeFormat = tf.dataset.tf; render(); return; }
});

view.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'q-subject'){ draft.subjectId = t.value; draft.itemIds = new Set(); render(); return; }
  if (t.id === 'q-date'){ draft.date = t.value; updateQuizPreview(); return; }

  if (t.matches('[data-quiz-topic]')){
    const subj = findSubject(draft.subjectId);
    const tp = subj && subj.topics.find(x => x.id === t.dataset.quizTopic);
    if (tp){ t.checked ? tp.items.forEach(it => draft.itemIds.add(it.id)) : tp.items.forEach(it => draft.itemIds.delete(it.id)); }
    render(); return;
  }

  if (t.matches('[data-quiz-item]')){
    t.checked ? draft.itemIds.add(t.dataset.quizItem) : draft.itemIds.delete(t.dataset.quizItem);
    render(); return;
  }

  if (t.dataset.setting){
    const key = t.dataset.setting;
    state.settings[key] = t.type === 'number' ? Number(t.value) : t.value;
    render(); return;
  }

  if (t.dataset.est){
    const id = t.dataset.est;
    for (const subj of state.subjects) for (const tp of subj.topics) for (const it of tp.items)
      if (it.id === id) it.estMin = Math.max(0, Number(t.value) || 0);
    render(); return;
  }
});

view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q-title'){ draft.title = t.value; return; }

  if (t.dataset.fam){
    const id = t.dataset.fam;
    for (const subj of state.subjects) for (const tp of subj.topics) for (const it of tp.items)
      if (it.id === id) it.familiarity = Number(t.value) / 100;
    updateRemLabel(id); return;
  }

  if (t.dataset.est){
    const id = t.dataset.est;
    for (const subj of state.subjects) for (const tp of subj.topics) for (const it of tp.items)
      if (it.id === id) it.estMin = Math.max(0, Number(t.value) || 0);
    updateRemLabel(id); return;
  }
});

function updateRemLabel(itemId){
  const el = document.getElementById('rem-' + itemId);
  if (!el) return;
  for (const subj of state.subjects) for (const tp of subj.topics) for (const it of tp.items)
    if (it.id === itemId){ el.textContent = '剩 ' + fmtDur(itemRemainingMin(it)); return; }
}

function updateQuizPreview(){
  const el = document.getElementById('q-preview');
  if (el) el.innerHTML = quizPreviewHtml();
}

/* =========================================================
   啟動
   ========================================================= */
render();
</script>
</body>
</html>
