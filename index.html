<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyPlanner · 逆向排程學習規劃</title>
<style>
:root{
  --purple:#7c3aed; --purple-light:#ede9fe; --purple-dark:#5b21b6;
  --bg:#f5f4fb; --card:#fff; --border:#e6e2f5; --text:#1f1b2e; --muted:#7b7690;
  --orange:#f59e0b; --red:#ef4444; --green:#22c55e; --yellow:#eab308;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
/* ---------- topbar ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px}
.brand h1{font-size:18px;letter-spacing:.3px}
.brand p{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:12px;border:1px solid var(--border);flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.tab:hover{background:#f3f0fd;color:var(--purple)}
.tab.active{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
/* ---------- panels ---------- */
.panel{display:none;animation:fade .2s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(30,27,46,.04)}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--purple)}
/* ---------- buttons ---------- */
.btn{font-family:inherit;border:1px solid var(--border);background:#fff;color:var(--text);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--purple);color:var(--purple)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.primary:hover{background:var(--purple-dark);color:#fff}
.btn.ghost{background:#f3f0fd;border-color:transparent;color:var(--purple)}
.btn.icon{padding:6px 12px;font-size:17px;line-height:1}
.btn.tiny{padding:2px 8px;font-size:11px;border-radius:7px}
.btn.danger{color:var(--red);border-color:transparent;background:#fee2e2}
.btn.danger:hover{background:#fecaca;color:#b91c1c}
.btn.wide{width:100%;margin-top:6px;padding:11px}
/* ---------- calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.month-title{font-size:17px;font-weight:800;letter-spacing:.3px;min-width:130px;text-align:center}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-weekdays div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cell{min-height:72px;border-radius:11px;border:1px solid #eeeaff;background:#fff;padding:5px 4px;
  cursor:pointer;position:relative;overflow:hidden;transition:.12s;display:flex;flex-direction:column;gap:3px}
.cell:hover{border-color:#c4b5fd;box-shadow:0 2px 8px rgba(124,58,237,.1)}
.cell.other{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cell.other .dnum{visibility:hidden}
.cell.today{background:var(--purple-light);border-color:#a78bfa}
.cell.sel{box-shadow:inset 0 0 0 2px var(--purple)}
.dnum{font-size:13px;font-weight:800;color:#4c4470;line-height:1.1}
.cell.today .dnum{color:var(--purple-dark)}
.evs{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.tag{font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:2px 4px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.more{background:#a8a3bd;text-align:center}
/* ---------- day detail ---------- */
.detail-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.detail-head h2{margin:0}
/* ---------- timeline ---------- */
.timeline{display:flex;flex-direction:column;gap:6px}
.tl-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:#faf9ff;border:1px solid #f0edfc}
.tl-item.study{background:#f7f4ff;border-color:#e3d9fe}
.tl-item.special{background:#fff8ec;border-color:#fde8c4}
.tl-item.fixed{background:#f7f7fa;border-color:#eef0f4;opacity:.8}
.tl-time{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;min-width:88px;padding-top:2px}
.tl-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.grey{background:#c3c7d4}
/* ---------- forms ---------- */
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:#fff;
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:100%;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
input[type=number]{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.segmented{display:inline-flex;background:#f3f0fd;padding:3px;border-radius:10px;gap:3px}
.segmented button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;
  color:var(--muted);padding:6px 18px;border-radius:8px;cursor:pointer}
.segmented button.on{background:#fff;color:var(--purple);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* ---------- scope tree ---------- */
.tree{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:11px;padding:8px;background:#fcfbff}
.topic{margin-bottom:6px}
.topic-head{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;background:#f3f0fd}
.topic-name{font-size:12.5px;font-weight:800;flex:1}
.topic-count{font-size:11px;color:var(--purple);font-weight:700}
.topic-items{padding:4px 0 4px 8px}
.item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;font-size:12.5px;cursor:pointer}
.item:hover{background:#f7f4ff}
.item-name{flex:1}
.item-min{font-size:11px;color:var(--muted);font-weight:600}
.chk input,.item input{width:auto;margin:0;accent-color:var(--purple);cursor:pointer}
/* ---------- preview ---------- */
.preview{border:1.5px solid #ddd0fd;background:#faf7ff;border-radius:12px;padding:12px;margin-bottom:12px}
.preview .big{font-size:22px;font-weight:900;color:var(--purple-dark);letter-spacing:.5px}
.preview .rows{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:12px;color:#5c5478}
.warn{margin-top:8px;font-size:12px;color:#a16207;background:#fef3c7;border-radius:8px;padding:6px 9px;font-weight:600}
/* ---------- quiz list ---------- */
.qrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:#faf9ff;
  border:1px solid #f0edfc;margin-bottom:7px}
.qrow .qname{font-weight:800;font-size:13px}
.qrow .qmeta{font-size:11.5px;color:var(--muted)}
.qrow .spacer{flex:1}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.yellow{background:#fef3c7;color:#a16207}
.badge.green{background:#dcfce7;color:#15803d}
/* ---------- subject cards ---------- */
.subj-card{border:1px solid var(--border);border-left:5px solid var(--purple);border-radius:14px;
  padding:14px;margin-bottom:12px;background:#fff}
.subj-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.subj-name{font-weight:800;font-size:14px;flex:1}
.subj-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.topic-block{border:1px solid #f0edfc;border-radius:11px;padding:9px;margin-bottom:8px;background:#fcfbff}
.topic-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;margin-bottom:6px}
.topic-title span{flex:1}
.item-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;flex-wrap:wrap}
.item-row .iname{flex:1;min-width:120px}
.mini{width:58px;padding:4px 6px;font-size:12px;text-align:center}
.slider{width:90px;accent-color:var(--purple);padding:0;border:0;background:transparent}
.fam-val{font-size:11px;font-weight:700;color:var(--purple);min-width:34px;text-align:right}
.remain{font-size:11px;color:var(--muted);min-width:56px}
.add-line{display:flex;gap:6px;margin-top:6px}
.add-line input{font-size:12px;padding:6px 8px}
.lib-grid{display:flex;flex-wrap:wrap;gap:7px}
.lib-btn{border:1.5px solid;background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;
  font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.lib-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.color-row{display:flex;gap:7px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.color-dot.on{border-color:#1f1b2e}
/* ---------- misc ---------- */
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 0}
.muted{color:var(--muted);font-size:12px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.overview{grid-template-columns:repeat(2,1fr)}}
.ov{background:#faf9ff;border:1px solid #f0edfc;border-radius:12px;padding:12px;text-align:center}
.ov .num{font-size:18px;font-weight:900;color:var(--purple-dark)}
.ov .lab{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.special-form{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:7px;align-items:end}
@media(max-width:700px){.special-form{grid-template-columns:1fr 1fr}}
.special-list{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.special-item{display:flex;align-items:center;gap:8px;background:#fff8ec;border:1px solid #fde8c4;
  border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600}
.special-item .sname{flex:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1f1b2e;color:#fff;
  padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;
  transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">SP</div>
      <div>
        <h1>StudyPlanner</h1>
        <p>由未來倒推，自動排好每一日</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="calendar">月曆</button>
      <button class="tab" data-tab="today">今日</button>
      <button class="tab" data-tab="quiz">測驗</button>
      <button class="tab" data-tab="subjects">科目</button>
      <button class="tab" data-tab="settings">設定</button>
    </nav>
  </header>
  <main>
    <section id="panel-calendar" class="panel active"></section>
    <section id="panel-today" class="panel"></section>
    <section id="panel-quiz" class="panel"></section>
    <section id="panel-subjects" class="panel"></section>
    <section id="panel-settings" class="panel"></section>
  </main>
</div>
<div id="toast"></div>

/* =======================================================================
   0. 工具
   ======================================================================= */
const pad = n => String(n).padStart(2,'0');
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const fromMin = m => `${pad(Math.floor(m/60)%24)}:${pad(Math.round(m%60))}`;
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid = () => 'id' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const DOW = ['日','一','二','三','四','五','六'];

let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

function buildSubject(libKey, dseDate){
  const lib = LIBRARY.find(l => l.key === libKey);
  if(!lib) return null;
  return {
    id: nid(), libKey, name: lib.name, color: lib.color,
    dseDate: dseDate || '',
    topics: lib.topics.map(tp => ({
      id: nid(), name: tp.name,
      items: tp.items.map(it => ({ id: nid(), name: it.name, est: it.est, fam: 0 }))
    }))
  };
}

/* =======================================================================
   5. 逆向排程引擎
   ======================================================================= */
function subjectRemaining(subj){
  let t = 0;
  subj.topics.forEach(tp => tp.items.forEach(it => {
    t += it.est * (1 - (it.fam || 0));
  }));
  return t;
}

function quizRemaining(q){
  const subj = getSubject(q.subjectId);
  if(!subj) return 0;
  const set = new Set(q.itemIds || []);
  let t = 0;
  subj.topics.forEach(tp => tp.items.forEach(it => {
    if(set.has(it.id)) t += it.est * (1 - (it.fam || 0));
  }));
  return t * (DIFF_MULT[q.difficulty] || 1);
}

/**
 * 某科目在某日的需求
 * 科目每日需求 = max(測驗需求, DSE 需求)
 * 測驗需求 = ceil(測驗總需時 ÷ max(1, 距測驗日數))
 * DSE 需求 = max(30, ceil(該科剩餘學習時間 ÷ max(1, 距DSE日數)))
 */
function subjectDemand(subj, dateStr){
  const qs = state.quizzes.filter(q => q.subjectId === subj.id && q.date >= dateStr);
  let quizNeed = 0, cap = Infinity, urgency = 0, label = '', blocked = false;
  let nearestDist = Infinity;

  for(const q of qs){
    const dist = dayDiff(dateStr, q.date);
    if(dist === 0){ blocked = true; continue; }          // 測驗當日清零
    if(dist === 1) cap = Math.min(cap, 90);              // 前 1 日上限 90 分鐘
    const rem = quizRemaining(q);
    quizNeed += Math.ceil(rem / Math.max(1, dist));
    const u = rem / Math.pow(Math.max(1, dist), 1.5) * (DIFF_COEF[q.difficulty] || 1);
    if(u > urgency) urgency = u;
    if(dist < nearestDist){ nearestDist = dist; label = q.name; }
  }

  if(blocked) return null; // 測驗當日該科唔排

  let dseNeed = 0;
  if(subj.dseDate){
    const dd = dayDiff(dateStr, subj.dseDate);
    if(dd > 0) dseNeed = Math.max(30, Math.ceil(subjectRemaining(subj) / dd));
  }

  let minutes = Math.max(quizNeed, dseNeed);
  if(minutes <= 0) return null;

  let kind = 'dse', lbl = 'DSE 溫習';
  if(quizNeed > 0 && quizNeed >= dseNeed){
    kind = 'quiz';
    lbl = `測驗衝刺 · 距測驗 ${nearestDist} 天`;
  }
  if(urgency === 0 && subj.dseDate){
    const dd = Math.max(1, dayDiff(dateStr, subj.dseDate));
    urgency = subjectRemaining(subj) / Math.pow(dd, 1.5) * 0.6;
  }

  return {
    subjectId: subj.id, subjectName: subj.name, color: subj.color,
    minutes: Math.round(minutes), cap, urgency, kind, label: lbl
  };
}

/** 計算某日完整日程 */
function computeDayPlan(dateStr){
  const s = state.settings;
  const d = parseKey(dateStr);
  const weekend = d.getDay() === 0 || d.getDay() === 6;
  const items = [];
  let winStart, winEnd;

  if(weekend){
    winStart = toMin(s.weekendStart);
    winEnd = Math.max(winStart, toMin(s.latestEnd) - s.dinner);
  }else{
    const ss = toMin(s.schoolStart), se = toMin(s.schoolEnd);
    items.push({ type:'fixed', name:'學校', start:ss, end:se });
    let t = se;
    items.push({ type:'fixed', name:'放學通勤', start:t, end:t + s.commute }); t += s.commute;
    items.push({ type:'fixed', name:'返家緩衝', start:t, end:t + s.buffer });  t += s.buffer;
    items.push({ type:'fixed', name:'晚餐',     start:t, end:t + s.dinner });  t += s.dinner;
    winStart = t;
    winEnd = toMin(s.latestEnd);
  }
  if(winEnd <= winStart) winEnd = winStart;

  /* 特別安排 */
  const specials = state.specials
    .filter(x => x.date === dateStr && x.start && x.end)
    .map(x => ({ ...x, s: toMin(x.start), e: toMin(x.end) }))
    .filter(x => x.e > x.s)
    .sort((a,b) => a.s - b.s);
  specials.forEach(x => items.push({ type:'special', name:x.name, start:x.s, end:x.e }));

  const busy = specials.map(x => [x.s, x.e]);

  /* 需求排序 */
  const demands = [];
  state.subjects.forEach(subj => {
    const dem = subjectDemand(subj, dateStr);
    if(dem && dem.minutes > 0) demands.push(dem);
  });
  demands.sort((a,b) => b.urgency - a.urgency);

  /* 分配區塊 */
  const placedSubjectIds = new Set();
  let cursorBase = winStart;

  for(const dem of demands){
    if(placedSubjectIds.size >= (s.maxSubjects || 3)) break;
    let need = dem.minutes;
    if(isFinite(dem.cap)) need = Math.min(need, dem.cap);
    let got = 0, cursor = cursorBase, guard = 0;

    while(got < need - 0.5 && guard++ < 60){
      const dur = Math.min(s.blockMinutes, need - got);
      if(dur < 5) break;

      /* 找空位 */
      let slot = cursor, tries = 0;
      while(tries++ < 80){
        let conflictEnd = null;
        for(const [bs, be] of busy){
          if(slot < be && slot + dur > bs) conflictEnd = Math.max(conflictEnd || 0, be);
        }
        if(conflictEnd === null) break;
        slot = conflictEnd;
      }
      if(slot + dur > winEnd) break;

      items.push({
        type:'study', name: dem.subjectName, start: slot, end: slot + dur,
        color: dem.color, kind: dem.kind, label: dem.label
      });
      busy.push([slot, slot + dur]);
      busy.sort((a,b) => a[0] - b[0]);
      got += dur;
      cursor = slot + dur + s.breakMinutes;
    }
    if(got > 0) placedSubjectIds.add(dem.subjectId);
  }

  items.sort((a,b) => a.start - b.start);
  return { items, winStart, winEnd, demands };
}

function fmtDur(min){
  if(state.settings.timeFormat === 'hr'){
    const h = min / 60;
    return (Number.isInteger(h) ? h : h.toFixed(1)) + ' 小時';
  }
  return Math.round(min) + ' 分鐘';
}

function timelineHtml(dateStr){
  const plan = computeDayPlan(dateStr);
  if(!plan.items.length) return '<p class="empty">當日沒有安排</p>';

  return '<div class="timeline">' + plan.items.map(it => {
    const dur = it.end - it.start;
    let cls = 'tl-item', dot = '<span class="dot grey"></span>', sub = '固定作息';
    if(it.type === 'study'){
      cls += ' study';
      dot = `<span class="dot" style="background:${it.color}"></span>`;
      sub = it.label;
    }else if(it.type === 'special'){
      cls += ' special';
      dot = '<span class="dot" style="background:#f59e0b"></span>';
      sub = '特別安排';
    }else{
      cls += ' fixed';
    }
    return `<div class="${cls}">
      <div class="tl-time">${fromMin(it.start)}–${fromMin(it.end)}</div>
      <div>
        <div class="tl-name">${dot}${esc(it.name)}</div>
        <div class="tl-sub">${esc(sub)} · ${dur} 分鐘</div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

function renderCalendar(){
  const el = document.getElementById('panel-calendar');
  const y = ui.viewYear, m = ui.viewMonth;
  const tk = todayK();
  const first = new Date(y, m, 1);
  const start = addDays(first, -first.getDay());

  let grid = '';
  for(let i = 0; i < 42; i++){
    const d = addDays(start, i);
    const ds = dateKey(d);
    const other = d.getMonth() !== m;
    const isToday = ds === tk;
    const isSel = ds === ui.selectedDate;

    const qs = state.quizzes.filter(q => q.date === ds);
    const sps = state.specials.filter(x => x.date === ds);

    const qTags = qs.slice(0,2).map(q => {
      const subj = getSubject(q.subjectId);
      const color = subj ? subj.color : '#8b5cf6';
      return `<div class="tag" style="background:${color}">${esc(q.name)}</div>`;
    });
    const sTags = sps.slice(0,2).map(x => `<div class="tag" style="background:#f59e0b">${esc(x.name)}</div>`);
    const extra = (qs.length - Math.min(2, qs.length)) + (sps.length - Math.min(2, sps.length));

    grid += `<div class="cell${other?' other':''}${isToday?' today':''}${isSel?' sel':''}"
      data-act="select-day" data-date="${ds}">
      <div class="dnum">${d.getDate()}</div>
      <div class="evs">${qTags.join('')}${sTags.join('')}${extra > 0 ? `<div class="tag more">+${extra}</div>` : ''}</div>
    </div>`;
  }

  el.innerHTML = `
    <div class="card">
      <div class="cal-nav">
        <button class="btn icon" data-act="prev-month">‹</button>
        <div class="month-title">${y} 年 ${m+1} 月</div>
        <button class="btn icon" data-act="next-month">›</button>

function dayDetailHtml(ds){
  const d = parseKey(ds);
  const qs = state.quizzes.filter(q => q.date === ds);
  const tk = todayK();
  const plan = computeDayPlan(ds);

  let quizBlock = '';
  if(qs.length){
    quizBlock = `<div style="margin-bottom:12px">${qs.map(q => {
      const subj = getSubject(q.subjectId);
      return `<div class="qrow">
        <span class="dot" style="background:${subj ? subj.color : '#999'}"></span>
        <div>
          <div class="qname">${esc(q.name)}</div>
          <div class="qmeta">${esc(subj ? subj.name : '')} · 難度 ${DIFF_LABEL[q.difficulty]} · 需時 ${fmtDur(Math.round(quizRemaining(q)))}</div>
        </div>
        <div class="spacer"></div>
        ${countdownBadge(Math.max(0, dayDiff(tk, ds)))}
      </div>`;
    }).join('')}</div>`;
  }

  const studyTotal = plan.items.filter(i => i.type === 'study')
    .reduce((a,b) => a + (b.end - b.start), 0);

  return `
    <div class="detail-head">
      <h2>${ds} · 星期${DOW[d.getDay()]}</h2>
      <span class="muted">已排溫習 ${fmtDur(studyTotal)}</span>
    </div>
    ${quizBlock}
    ${timelineHtml(ds)}
    <h2 style="margin-top:16px">特別安排</h2>
    ${specialFormHtml(ds)}
  `;
}

/* =======================================================================
   8. 今日面板
   ======================================================================= */
function renderToday(){
  const el = document.getElementById('panel-today');
  const tk = todayK();
  const d = parseKey(tk);
  const plan = computeDayPlan(tk);

  let specialTotal = 0;
  plan.items.filter(i => i.type === 'special').forEach(i => {
    const s = Math.max(i.start, plan.winStart), e = Math.min(i.end, plan.winEnd);
    if(e > s) specialTotal += e - s;
  });
  const avail = Math.max(0, (plan.winEnd - plan.winStart) - specialTotal);
  const studied = plan.items.filter(i => i.type === 'study')
    .reduce((a,b) => a + (b.end - b.start), 0);
  const buffer = Math.max(0, avail - studied);

  const upcoming = state.quizzes
    .filter(q => { const dd = dayDiff(tk, q.date); return dd >= 0 && dd <= 14; })
    .sort((a,b) => a.date.localeCompare(b.date));

  el.innerHTML = `
    <div class="card">
      <h2>${tk} · 星期${DOW[d.getDay()]} · 今日總覽</h2>
      <div class="overview">
        <div class="ov"><div class="num">${fmtDur(avail)}</div><div class="lab">放學後可用</div></div>
        <div class="ov"><div class="num">${fmtDur(studied)}</div><div class="lab">已排溫習</div></div>
        <div class="ov"><div class="num">${fmtDur(buffer)}</div><div class="lab">剩餘緩衝</div></div>
        <div class="ov"><div class="num">${upcoming.length}</div><div class="lab">14 日內測驗</div></div>
      </div>
      <p class="muted" style="margin-top:10px">
        每日最多 ${state.settings.maxSubjects} 科 · 時間顯示：${state.settings.timeFormat === 'hr' ? '小時' : '分鐘'}
      </p>
    </div>

    <div class="card">
      <h2>今日時間表</h2>
      ${timelineHtml(tk)}
      <h2 style="margin-top:16px">加入特別安排</h2>
      ${specialFormHtml(tk)}
    </div>

    <div class="card">
      <h2>未來 14 日測驗</h2>
      ${upcoming.length ? upcoming.map(q => {
        const subj = getSubject(q.subjectId);
        const dist = dayDiff(tk, q.date);
        return `<div class="qrow">
          <span class="dot" style="background:${subj ? subj.color : '#999'}"></span>
          <div>
            <div class="qname">${esc(q.name)}</div>
            <div class="qmeta">${esc(subj ? subj.name : '')} · ${q.date} · 需時 ${fmtDur(Math.round(quizRemaining(q)))}</div>
          </div>
          <div class="spacer"></div>
          ${countdownBadge(dist)}
        </div>`;
      }).join('') : '<p class="empty">未來 14 日沒有測驗</p>'}
    </div>
  `;
}

          </div>

          ${dist >= 0 ? countdownBadge(dist) : '<span class="badge green">已完結</span>'}

        </div>`;
      }).join('') : '<p class="empty">尚未加入任何測驗</p>'}

function renderScopeTree(){
  const box = document.getElementById('scopeTree');
  if(!box) return;
  const subj = getSubject(ui.form.subjectId);
  if(!subj){ box.innerHTML = '<p class="empty">未選擇科目</p>'; return; }

  const sel = new Set(ui.form.items);

  box.innerHTML = subj.topics.map(tp => {
    const selCount = tp.items.filter(it => sel.has(it.id)).length;
    const all = tp.items.length > 0 && selCount === tp.items.length;
    return `<div class="topic">
      <div class="topic-head">
        <input type="checkbox" data-topic="${tp.id}" ${all ? 'checked' : ''}>
        <span class="topic-name">${esc(tp.name)}</span>
        <span class="topic-count">已選 ${selCount}/${tp.items.length}</span>
      </div>
      <div class="topic-items">
        ${tp.items.map(it => `<label class="item">
          <input type="checkbox" data-item="${it.id}" ${sel.has(it.id) ? 'checked' : ''}>
          <span class="item-name">${esc(it.name)}</span>
          <span class="item-min">剩 ${Math.round(it.est * (1 - (it.fam || 0)))} 分</span>
        </label>`).join('')}
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('input[data-item]').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.item;
      if(cb.checked) ui.form.items.push(id);
      else ui.form.items = ui.form.items.filter(x => x !== id);
      renderScopeTree(); renderQuizPreview();
    });
  });

  box.querySelectorAll('input[data-topic]').forEach(cb => {
    cb.addEventListener('change', () => {
      const tp = subj.topics.find(t => t.id === cb.dataset.topic);
      if(!tp) return;
      const ids = tp.items.map(it => it.id);
      if(cb.checked) ui.form.items = Array.from(new Set([...ui.form.items, ...ids]));
      else ui.form.items = ui.form.items.filter(x => !ids.includes(x));
      renderScopeTree(); renderQuizPreview();
    });
  });
}

function renderQuizPreview(){
  const box = document.getElementById('quizPreview');
  if(!box) return;
  const subj = getSubject(ui.form.subjectId);
  if(!subj || !ui.form.date){
    box.innerHTML = '<span class="muted">選擇科目與日期後，即時顯示估算</span>';
    return;
  }
  const sel = new Set(ui.form.items);
  let total = 0, zeros = 0, count = 0;
  subj.topics.forEach(tp => tp.items.forEach(it => {
    if(sel.has(it.id)){
      total += it.est * (1 - (it.fam || 0));
      if((it.fam || 0) === 0) zeros++;
      count++;
    }
  }));
  const need = total * DIFF_MULT[ui.form.difficulty];
  const dist = Math.max(0, dayDiff(todayK(), ui.form.date));
  const perDay = Math.ceil(need / Math.max(1, dist));

  box.innerHTML = `
    <div class="big">${fmtDur(Math.round(need))}</div>
    <div class="rows">
      <span>距測驗 <b>${dist}</b> 天</span>
      <span>平均每日 <b>${perDay}</b> 分鐘</span>
      <span>已選 <b>${count}</b> 個細項</span>
      <span>難度 <b>${DIFF_LABEL[ui.form.difficulty]}</b></span>
    </div>
    ${zeros > 0 ? `<div class="warn">⚠ 有 ${zeros} 個細項熟悉度為 0（完全未溫），建議先安排首次學習。</div>` : ''}
  `;
}

function bindQuizForm(){
  const sel = document.getElementById('qSubject');
  const dt  = document.getElementById('qDate');
  const nm  = document.getElementById('qName');
  const diff = document.getElementById('qDiff');

  if(sel) sel.addEventListener('change', () => {
    ui.form.subjectId = sel.value;
    ui.form.items = [];
    renderScopeTree(); renderQuizPreview();
  });
  if(dt) dt.addEventListener('change', () => { ui.form.date = dt.value; renderQuizPreview(); });
  if(nm) nm.addEventListener('input', () => { ui.form.name = nm.value; });
  if(diff) diff.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      ui.form.difficulty = b.dataset.diff;
      diff.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      renderQuizPreview();
    });
  });
}

            <span class="fam-val" data-famval="${it.id}">${Math.round((it.fam || 0) * 100)}%</span>
            <span class="remain" data-remain="${it.id}">剩 ${Math.round(it.est * (1 - (it.fam || 0)))} 分</span>
            <button class="btn tiny danger" data-act="del-item"
              data-sid="${subj.id}" data-tid="${tp.id}" data-iid="${it.id}">✕</button>

        </div>
      </div>`).join('')}

      <input placeholder="新課題名稱" data-newtopic="${subj.id}">
      <button class="btn tiny" data-act="add-topic" data-id="${subj.id}">＋ 課題</button>
    </div>
  </div>`;
}

function bindSubjectInputs(){
  /* 熟悉度滑桿 */
  document.querySelectorAll('input[data-fam]').forEach(inp => {
    inp.addEventListener('input', () => {
      const item = findItem(inp.dataset.fam);
      if(!item) return;
      item.fam = Number(inp.value) / 100;
      document.querySelectorAll(`[data-famval="${item.id}"]`).forEach(e => e.textContent = Math.round(item.fam * 100) + '%');
      document.querySelectorAll(`[data-remain="${item.id}"]`).forEach(e =>
        e.textContent = '剩 ' + Math.round(item.est * (1 - item.fam)) + ' 分');
      refreshSubjectRemain();
      save();
    });
  });
  /* 預估分鐘 */
  document.querySelectorAll('input[data-est]').forEach(inp => {
    inp.addEventListener('input', () => {
      const item = findItem(inp.dataset.est);
      if(!item) return;
      const v = Math.max(5, Number(inp.value) || 5);
      item.est = v;
      document.querySelectorAll(`[data-remain="${item.id}"]`).forEach(e =>
        e.textContent = '剩 ' + Math.round(item.est * (1 - item.fam)) + ' 分');
      refreshSubjectRemain();
      save();
    });
  });
  /* DSE 日期 */
  document.querySelectorAll('input[data-dse]').forEach(inp => {
    inp.addEventListener('change', () => {
      const subj = getSubject(inp.dataset.dse);
      if(!subj) return;
      subj.dseDate = inp.value;
      save(); renderSubjects(); toast('已更新 DSE 日期');
    });
  });
}

function refreshSubjectRemain(){
  state.subjects.forEach(subj => {
    document.querySelectorAll(`[data-sremain="${subj.id}"]`).forEach(e =>
      e.textContent = fmtDur(subjectRemaining(subj)));
  });
}

function findItem(itemId){
  for(const subj of state.subjects)
    for(const tp of subj.topics)
      for(const it of tp.items)
        if(it.id === itemId) return it;
  return null;
}

  b.addEventListener('click', () => { ui.tab = b.dataset.tab; render(); });
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  /* ---- 月曆 ---- */
  if(act === 'prev-month'){
    ui.viewMonth--;
    if(ui.viewMonth < 0){ ui.viewMonth = 11; ui.viewYear--; }
    renderCalendar(); return;
  }
  if(act === 'next-month'){
    ui.viewMonth++;
    if(ui.viewMonth > 11){ ui.viewMonth = 0; ui.viewYear++; }
    renderCalendar(); return;
  }
  if(act === 'goto-today'){
    const n = new Date();
    ui.viewYear = n.getFullYear(); ui.viewMonth = n.getMonth();
    ui.selectedDate = dateKey(n);
    renderCalendar(); return;
  }
  if(act === 'select-day'){
    ui.selectedDate = el.dataset.date;
    renderCalendar(); return;
  }

  /* ---- 特別安排 ---- */
  if(act === 'add-special'){
    const date = el.dataset.date;
    const name = document.getElementById('spName').value.trim();
    const start = document.getElementById('spStart').value;
    const end = document.getElementById('spEnd').value;
    if(!name) return toast('請輸入事件名稱');
    if(start && end && toMin(end) <= toMin(start)) return toast('結束時間要遲過開始時間');
    state.specials.push({ id: nid(), date, name, start, end });
    save();
    toast('已加入特別安排');
    render();
    return;
  }
  if(act === 'del-special'){
    state.specials = state.specials.filter(x => x.id !== el.dataset.id);
    save(); render(); return;
  }

  /* ---- 測驗 ---- */
  if(act === 'add-quiz'){
    const f = ui.form;
    const subj = getSubject(f.subjectId);
    if(!subj) return toast('請選擇科目');
    if(!f.date) return toast('請選擇測驗日期');
    if(!f.items.length) return toast('請勾選測驗範圍');
    state.quizzes.push({
      id: nid(),
      subjectId: subj.id,
      name: f.name.trim() || `${subj.name} Quiz`,
      date: f.date,
      difficulty: f.difficulty,
      itemIds: [...f.items]
    });
    f.items = []; f.name = '';
    save();
    toast('已加入測驗，排程即時更新');
    render();
    return;
  }
  if(act === 'del-quiz'){
    state.quizzes = state.quizzes.filter(q => q.id !== el.dataset.id);
    save(); render(); return;
  }

  /* ---- 科目 ---- */
  if(act === 'add-lib'){
    const subj = buildSubject(el.dataset.key, '2027-04-10');
    if(!subj) return;
    state.subjects.push(subj);
    save(); toast('已加入 ' + subj.name);
    render(); return;
  }
  if(act === 'pick-color'){
    ui.newSubject.color = el.dataset.color;
    renderSubjects(); return;
  }
  if(act === 'add-custom'){
    const nameEl = document.getElementById('nsName');
    const dateEl = document.getElementById('nsDate');
    const name = nameEl.value.trim();
    if(!name) return toast('請輸入科目名稱');
    if(!dateEl.value) return toast('請選擇 DSE 考試日期');
    state.subjects.push({
      id: nid(), libKey: null, name, color: ui.newSubject.color,
      dseDate: dateEl.value, topics: []
    });
    ui.newSubject = { name:'', dseDate:'', color: COLORS[0] };
    save(); toast('已新增科目');
    render(); return;
  }
  if(act === 'del-subject'){
    const id = el.dataset.id;
    state.subjects = state.subjects.filter(s => s.id !== id);
    state.quizzes = state.quizzes.filter(q => q.subjectId !== id);
    save(); render(); return;
  }
  if(act === 'del-topic'){
    const subj = getSubject(el.dataset.sid);
    if(!subj) return;
    subj.topics = subj.topics.filter(t => t.id !== el.dataset.tid);
    save(); render(); return;
  }
  if(act === 'del-item'){
    const subj = getSubject(el.dataset.sid);
    if(!subj) return;
    const tp = subj.topics.find(t => t.id === el.dataset.tid);
    if(!tp) return;
    tp.items = tp.items.filter(i => i.id !== el.dataset.iid);
    save(); render(); return;
  }
  if(act === 'add-topic'){
    const subj = getSubject(el.dataset.id);
    if(!subj) return;
    const inp = document.querySelector(`[data-newtopic="${subj.id}"]`);
    const name = (inp.value || '').trim();
    if(!name) return toast('請輸入課題名稱');
    subj.topics.push({ id: nid(), name, items: [] });
    save(); render(); return;
  }
  if(act === 'add-item'){
    const subj = getSubject(el.dataset.sid);
    if(!subj) return;
    const tp = subj.topics.find(t => t.id === el.dataset.tid);
    if(!tp) return;
    const nameInp = document.querySelector(`[data-newitem="${tp.id}"]`);
    const minInp  = document.querySelector(`[data-newmin="${tp.id}"]`);
    const name = (nameInp.value || '').trim();
    if(!name) return toast('請輸入細項名稱');
    tp.items.push({ id: nid(), name, est: Math.max(5, Number(minInp.value) || 45), fam: 0 });
    save(); render(); return;
  }

  /* ---- 設定 ---- */
  if(act === 'reset-all'){
    if(confirm('確定重設？所有自訂科目、測驗、特別安排都會被清除。')){
      state = seedState();
      save(); ui.tab = 'calendar';
      render(); toast('已重設為預設科目');
    }
    return;
  }
});

/* 自訂科目名稱輸入保持 */
document.addEventListener('input', e => {
  if(e.target.id === 'nsName') ui.newSubject.name = e.target.value;
  if(e.target.id === 'nsDate') ui.newSubject.dseDate = e.target.value;
});

/* =======================================================================
   14. 啟動
   ======================================================================= */
render();
</script>
</body>
</html>
