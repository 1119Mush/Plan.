<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyPlanner — 測驗 × DSE 排程</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --primary:#6366f1; --primary-dark:#4f46e5;
    --danger:#ef4444; --warn:#f59e0b; --ok:#10b981;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:920px;margin:0 auto;padding:16px 14px 80px;}

  /* ---------- header ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0 10px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px;}
  .brand .logo{
    width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:grid;place-items:center;color:#fff;font-size:16px;
  }
  .today-label{font-size:13px;color:var(--muted);font-weight:500;}

  /* ---------- tabs ---------- */
  nav.tabs{
    display:flex;gap:6px;background:#e2e8f0;padding:5px;border-radius:14px;margin-bottom:16px;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;min-width:80px;border:0;background:transparent;padding:9px 12px;border-radius:10px;
    font-size:14px;font-weight:600;color:#475569;cursor:pointer;transition:.15s;white-space:nowrap;
    font-family:inherit;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  /* ---------- cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card h2{
    font-size:15px;margin:0 0 14px;font-weight:700;letter-spacing:-.2px;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .badge{
    font-size:11px;font-weight:700;background:#eef2ff;color:var(--primary-dark);
    padding:2px 8px;border-radius:20px;
  }

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;}
  .stat{
    background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px;
  }
  .stat .v{font-size:20px;font-weight:800;letter-spacing:-.5px;}
  .stat .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}

  /* ---------- banner ---------- */
  .banner{
    border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;
    display:flex;gap:10px;align-items:flex-start;line-height:1.5;
  }
  .banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
  .banner.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;}
  .banner b{font-weight:700;}

  /* ---------- timeline ---------- */
  .tl-row{
    display:grid;grid-template-columns:64px 10px 1fr auto;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px solid #f1f5f9;
  }
  .tl-row:last-child{border-bottom:0;}
  .tl-time{font-size:12px;font-variant-numeric:tabular-nums;color:#475569;font-weight:600;line-height:1.25;}
  .tl-time span{display:block;font-weight:400;color:#94a3b8;font-size:11px;}
  .tl-dot{width:10px;height:10px;border-radius:50%;}
  .tl-body{min-width:0;}
  .tl-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-sub{font-size:11.5px;color:var(--muted);}
  .tl-dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tl-row.study .tl-title{color:var(--primary-dark);}
  .tl-row.buffer .tl-title,.tl-row.school .tl-title{color:#64748b;font-weight:500;}

  /* ---------- forms ---------- */
  label.fld{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px;}
  input[type=text],input[type=date],input[type=number],input[type=time],select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
    transition:.15s;
  }
  input:focus,select:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  button.primary{
    background:var(--primary);color:#fff;border:0;padding:11px 20px;border-radius:11px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button.primary:hover{background:var(--primary-dark);}
  button.primary:disabled{background:#cbd5e1;cursor:not-allowed;}
  button.ghost{
    background:#fff;border:1px solid var(--border);color:#475569;padding:9px 16px;
    border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  button.ghost:hover{background:#f8fafc;}
  button.danger-sm{
    background:transparent;border:0;color:#94a3b8;cursor:pointer;font-size:16px;
    padding:4px 8px;border-radius:8px;font-family:inherit;
  }
  button.danger-sm:hover{background:#fef2f2;color:var(--danger);}

  .segmented{display:flex;gap:6px;}
  .segmented button{
    flex:1;padding:9px;border:1px solid var(--border);background:#fff;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;color:#475569;font-family:inherit;transition:.15s;
  }
  .segmented button.on{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* ---------- quiz topic tree ---------- */
  .topic-block{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .topic-label{
    display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;
    cursor:pointer;font-size:13.5px;font-weight:600;
  }
  .topic-label input{margin:0;width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
  .item-list{padding:4px 0;}
  .item-check{
    display:flex;align-items:center;gap:9px;padding:7px 12px 7px 34px;font-size:13px;
    cursor:pointer;transition:.12s;
  }
  .item-check:hover{background:#f8fafc;}
  .item-check input{margin:0;width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
  .item-check .muted{margin-left:auto;font-size:11.5px;color:#94a3b8;font-variant-numeric:tabular-nums;}

  /* ---------- preview ---------- */
  .preview{
    background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:12px 14px;
    font-size:13px;color:#3730a3;line-height:1.7;margin-top:4px;
  }
  .preview .big{font-size:16px;font-weight:800;}

  /* ---------- quiz list ---------- */
  .quiz-item{
    display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f1f5f9;
  }
  .quiz-item:last-child{border-bottom:0;}
  .quiz-item .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .quiz-item .meta{flex:1;min-width:0;}
  .quiz-item .t{font-size:14px;font-weight:600;}
  .quiz-item .s{font-size:12px;color:var(--muted);}
  .pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .pill.urgent{background:#fef2f2;color:#b91c1c;}
  .pill.soon{background:#fffbeb;color:#b45309;}
  .pill.later{background:#f0fdf4;color:#15803d;}
  .pill.done{background:#f1f5f9;color:#64748b;}

  /* ---------- subject editor ---------- */
  .subj-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .subj-head .dot{width:12px;height:12px;border-radius:50%;}
  .subj-head .nm{font-weight:700;font-size:15px;}
  .subj-head .ex{margin-left:auto;font-size:12px;color:var(--muted);}
  .topic-group{margin:10px 0 4px;}
  .topic-group .th{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .item-row{
    display:grid;grid-template-columns:1fr 90px 1fr 72px;gap:10px;align-items:center;
    padding:6px 0;font-size:13px;
  }
  .item-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-row input[type=number]{padding:5px 8px;font-size:12.5px;}
  .item-row .rem{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}
  .item-row input[type=range]{width:100%;accent-color:var(--primary);}
  @media(max-width:640px){
    .item-row{grid-template-columns:1fr 1fr;gap:6px;}
    .item-row .nm{grid-column:1/-1;}
    .item-row .rem{grid-column:2;text-align:right;}
  }

  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .mt12{margin-top:12px;}
  .rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .empty{text-align:center;padding:26px;color:#94a3b8;font-size:13.5px;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="logo">▦</div>
      <div>
        <div>StudyPlanner</div>
        <div class="today-label" id="todayLabel"></div>
      </div>
    </div>
    <div class="rowflex">
      <span class="pill soon" id="examCountdown">—</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">今日計劃</button>
    <button data-tab="quizzes">測驗</button>
    <button data-tab="subjects">課程樹</button>
    <button data-tab="settings">設定</button>
  </nav>

  <main id="view"></main>
</div>

<script>
/* =========================================================
   工具函數
   ========================================================= */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');

function fmtDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return fmtDate(new Date()); }
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
function daysBetween(a, b){
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}
function weekdayOf(dateStr){ return new Date(dateStr + 'T00:00:00').getDay(); }
const toMin  = s => { const [h,m] = s.split(':').map(Number); return h*60 + m; };
const toTime = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
function fmtDur(min){
  min = Math.round(min);
  if (min < 60) return `${min} 分`;
  const h = Math.floor(min/60), m = min%60;
  return m ? `${h} 小時 ${m} 分` : `${h} 小時`;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const WD = ['日','一','二','三','四','五','六'];

/* =========================================================
   狀態
   ========================================================= */
const STORAGE_KEY = 'studyplanner.v2';

function defaultState(){
  const t = todayStr();
  return {
    settings: {
      schoolStart: '07:00',
      schoolEnd:   '17:00',
      commuteHome: 45,
      windDown:    30,
      dinner:      45,
      bedtime:     '23:00',
      weekendStart:'09:00',
      blockMin:    30,
      breakMin:    10
    },
    subjects: [
      {
        id:'physics', name:'Physics', color:'#6366f1', examDate: addDays(t, 180),
        topics:[
          { id:'phy.mech', name:'Mechanics', items:[
            { id:'phy.mech.1', name:'Force and Motion',      estMin:150, familiarity:0.40 },
            { id:'phy.mech.2', name:'Momentum & Collisions', estMin:120, familiarity:0.10 },
            { id:'phy.mech.3', name:'Circular Motion',       estMin: 90, familiarity:0.00 }
          ]},
          { id:'phy.wave', name:'Waves', items:[
            { id:'phy.wave.1', name:'Wave Properties',       estMin:100, familiarity:0.60 },
            { id:'phy.wave.2', name:'Sound & Light',         estMin:110, familiarity:0.30 }
          ]},
          { id:'phy.elec', name:'Electricity', items:[
            { id:'phy.elec.1', name:'Circuits',              estMin:130, familiarity:0.20 },
            { id:'phy.elec.2', name:'Electromagnetism',      estMin:140, familiarity:0.00 }
          ]}
        ]
      },
      {
        id:'math', name:'Mathematics', color:'#f59e0b', examDate: addDays(t, 175),
        topics:[
          { id:'math.quad', name:'Quadratic Equations', items:[
            { id:'math.quad.1', name:'Completing the Square', estMin: 80, familiarity:0.50 },
            { id:'math.quad.2', name:'Discriminant & Roots',  estMin: 70, familiarity:0.40 }
          ]},
          { id:'math.trig', name:'Trigonometry', items:[
            { id:'math.trig.1', name:'Identities',            estMin:120, familiarity:0.20 },
            { id:'math.trig.2', name:'Graphs of Trig Funcs',  estMin:100, familiarity:0.10 }
          ]},
          { id:'math.stat', name:'Statistics', items:[
            { id:'math.stat.1', name:'Probability',           estMin: 90, familiarity:0.50 },
            { id:'math.stat.2', name:'Normal Distribution',   estMin:100, familiarity:0.30 }
          ]}
        ]
      },
      {
        id:'english', name:'English', color:'#10b981', examDate: addDays(t, 170),
        topics:[
          { id:'eng.read', name:'Reading', items:[
            { id:'eng.read.1', name:'Paper 1 Practice',       estMin:150, familiarity:0.50 },
            { id:'eng.read.2', name:'Vocabulary Building',    estMin: 90, familiarity:0.60 }
          ]},
          { id:'eng.write', name:'Writing', items:[
            { id:'eng.write.1', name:'Essay Structure',       estMin:120, familiarity:0.40 },
            { id:'eng.write.2', name:'Practical Writing',     estMin: 80, familiarity:0.30 }
          ]},
          { id:'eng.speak', name:'Listening & Speaking', items:[
            { id:'eng.speak.1', name:'Listening Practice',    estMin: 80, familiarity:0.50 }
          ]}
        ]
      }
    ],
    quizzes: [
      { id:'q1', subjectId:'math',    date: addDays(t, 7),
        title:'Math Quiz – Quadratics', difficulty:2, status:'planned',
        topicIds:['math.quad'], itemIds:['math.quad.1','math.quad.2'] },
      { id:'q2', subjectId:'physics', date: addDays(t, 14),
        title:'Physics Quiz – Mechanics', difficulty:3, status:'planned',
        topicIds:['phy.mech'], itemIds:['phy.mech.1','phy.mech.2'] }
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.settings || !Array.isArray(s.subjects) || !Array.isArray(s.quizzes)) return null;
    return s;
  }catch(e){ return null; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

let state = loadState() || defaultState();

/* =========================================================
   核心運算
   ========================================================= */
function findSubject(id){ return state.subjects.find(s => s.id === id); }

function itemRemainingMin(it){
  return Math.max(0, Math.round(it.estMin * (1 - (it.familiarity ?? 0))));
}

function subjectRemainingMin(subj){
  let t = 0;
  for (const tp of subj.topics) for (const it of tp.items) t += itemRemainingMin(it);
  return t;
}

/* 測驗總需時 */
function quizRequiredMin(quiz){
  const subj = findSubject(quiz.subjectId);
  if (!subj) return 0;
  const mult = ({1:1.0, 2:1.15, 3:1.35})[quiz.difficulty] ?? 1.0;
  const wantItems = new Set(quiz.itemIds || []);
  let total = 0;

  for (const tp of subj.topics){
    const selected = (quiz.topicIds || []).includes(tp.id);
    for (const it of tp.items){
      let include;
      if (wantItems.size) include = wantItems.has(it.id);
      else                include = selected;
      if (include) total += itemRemainingMin(it) * mult;
    }
  }
  return Math.round(total / 5) * 5;
}

/* 測驗緊急度 */
function quizUrgency(quiz, dateStr){
  const days  = Math.max(1, daysBetween(dateStr, quiz.date));
  const need  = quizRequiredMin(quiz);
  const diffW = ({1:0.8, 2:1.0, 3:1.3})[quiz.difficulty] ?? 1;
  return (need / Math.pow(days, 1.5)) * diffW;
}

function nearestUpcomingQuiz(dateStr, subjectId){
  let best = null;
  for (const q of state.quizzes){
    if (q.status !== 'planned' || q.subjectId !== subjectId) continue;
    if (daysBetween(dateStr, q.date) < 0) continue;
    if (!best || q.date < best.date) best = q;
  }
  return best;
}

/* 當日該科上限（測驗保護規則） */
function subjectDayCap(dateStr, subjectId){
  let cap = Infinity;
  for (const q of state.quizzes){
    if (q.status !== 'planned' || q.subjectId !== subjectId) continue;
    const d = daysBetween(dateStr, q.date);
    if (d === 0) return 0;                       // 測驗當日：清零
    if (d === 1) cap = Math.min(cap, 90);        // 測驗前 1 日：上限 90 分
  }
  return cap;
}

/* 今日需求（分鐘） */
function subjectDemand(dateStr, subjectId){
  let demand = 0;

  // 1) 測驗需求（14 日內）
  for (const q of state.quizzes){
    if (q.status !== 'planned' || q.subjectId !== subjectId) continue;
    const d = daysBetween(dateStr, q.date);
    if (d < 0 || d > 14) continue;
    const perDay = Math.ceil(quizRequiredMin(q) / Math.max(1, d));
    demand = Math.max(demand, perDay);
  }

  // 2) DSE 恆常需求
  const subj = findSubject(subjectId);
  if (subj){
    const days = daysBetween(dateStr, subj.examDate);
    const need = subjectRemainingMin(subj);
    if (days >= 0 && need > 0){
      demand = Math.max(demand, Math.max(30, Math.ceil(need / Math.max(1, days))));
    }
  }
  return demand;
}

/* 一天的固定時段與自由窗口 */
function dayTimeline(dateStr){
  const s = state.settings;
  const wd = weekdayOf(dateStr);
  const isSchool = wd >= 1 && wd <= 5;
  const fixed = [];
  let freeStart;

  if (isSchool){
    const schoolS = toMin(s.schoolStart);
    const schoolE = toMin(s.schoolEnd);
    fixed.push({ start: schoolS, end: schoolE, label: '學校', kind: 'school' });

    const commuteEnd = schoolE + Number(s.commuteHome);
    if (commuteEnd > schoolE)
      fixed.push({ start: schoolE, end: commuteEnd, label: '通勤', kind: 'buffer' });

    const windEnd = commuteEnd + Number(s.windDown);
    if (Number(s.windDown) > 0)
      fixed.push({ start: commuteEnd, end: windEnd, label: '休息 / 緩衝', kind: 'buffer' });

    const dinnerEnd = windEnd + Number(s.dinner);
    if (Number(s.dinner) > 0)
      fixed.push({ start: windEnd, end: dinnerEnd, label: '晚餐', kind: 'buffer' });

    freeStart = dinnerEnd;
  } else {
    freeStart = toMin(s.weekendStart);
  }
  return { freeStart, freeEnd: toMin(s.bedtime), fixed };
}

/* 挑選下一個要排的科目 */
function pickSubject(dateStr, demands, allocated){
  let best = null, bestScore = 0;
  for (const id in demands){
    const rem = demands[id] - (allocated[id] || 0);
    if (rem <= 0) continue;
    if ((allocated[id] || 0) >= subjectDayCap(dateStr, id)) continue;

    let score = rem;
    const q = nearestUpcomingQuiz(dateStr, id);
    if (q){
      const d = daysBetween(dateStr, q.date);
      if (d <= 1) score *= 3;
      else if (d <= 3) score *= 1.8;
      else if (d <= 7) score *= 1.3;
    }
    if (score > bestScore){ bestScore = score; best = id; }
  }
  return best;
}

/* 生成一天計劃 */
function buildPlan(dateStr){
  const s = state.settings;
  const tl = dayTimeline(dateStr);
  if (tl.freeEnd <= tl.freeStart) return [];

  const demands = {};
  for (const subj of state.subjects){
    const d = subjectDemand(dateStr, subj.id);
    if (d > 0) demands[subj.id] = d;
  }

  const allocated = {};
  const blocks = [];
  const BLOCK = Number(s.blockMin) || 30;
  const BRK   = Number(s.breakMin) || 0;

  let cursor = tl.freeStart;
  let guard = 0;

  while (cursor + 15 <= tl.freeEnd && guard++ < 300){
    const pick = pickSubject(dateStr, demands, allocated);
    if (!pick) break;

    const len = Math.min(BLOCK, tl.freeEnd - cursor);
    if (len < 15) break;

    blocks.push({ start: cursor, end: cursor + len, subjectId: pick });
    allocated[pick] = (allocated[pick] || 0) + len;
    cursor += len + BRK;
  }
  return blocks;
}

/* 本週（7 日）測驗需求 vs 可用時間 */
function weeklyStats(dateStr){
  let quizNeed = 0;
  const list = [];
  for (const q of state.quizzes){
    if (q.status !== 'planned') continue;
    const d = daysBetween(dateStr, q.date);
    if (d >= 0 && d <= 6){
      const need = quizRequiredMin(q);
      quizNeed += need;
      list.push({ q, need, d });
    }
  }
  let avail = 0;
  for (let i = 0; i < 7; i++){
    const tl = dayTimeline(addDays(dateStr, i));
    avail += Math.max(0, tl.freeEnd - tl.freeStart);
  }
  avail = Math.round(avail * 0.85); // 扣休息
  return { quizNeed, avail, list };
}

/* =========================================================
   UI 狀態
   ========================================================= */
let activeTab = 'today';
let draft = null;

function newDraft(){
  const first = state.subjects[0];
  return {
    subjectId: first ? first.id : '',
    date: addDays(todayStr(), 7),
    title: '',
    difficulty: 2,
    itemIds: new Set()
  };
}

/* =========================================================
   渲染：今日
   ========================================================= */
function viewToday(){
  const date = todayStr();
  const tl = dayTimeline(date);
  const plan = buildPlan(date);
  const available = Math.max(0, tl.freeEnd - tl.freeStart);
  const planned = plan.reduce((a, b) => a + (b.end - b.start), 0);

  const entries = [
    ...tl.fixed,
    ...plan.map(b => ({ ...b, kind: 'study' }))
  ].sort((a, b) => a.start - b.start);

  const rows = entries.map(e => {
    if (e.kind === 'study'){
      const subj = findSubject(e.subjectId);
      const q = nearestUpcomingQuiz(date, e.subjectId);
      const dLeft = q ? daysBetween(date, q.date) : null;
      const isQuiz = q && dLeft <= 14;
      return `<div class="tl-row study">
        <div class="tl-time">${toTime(e.start)}<span>${toTime(e.end)}</span></div>
        <div class="tl-dot" style="background:${subj ? subj.color : '#94a3b8'}"></div>
        <div class="tl-body">
          <div class="tl-title">${esc(subj ? subj.name : '？')}</div>
          <div class="tl-sub">${isQuiz ? '⚡ 測驗衝刺 · 距測驗 ' + dLeft + ' 天' : 'DSE 恆常溫習'}</div>
        </div>
        <div class="tl-dur">${e.end - e.start} 分</div>
      </div>`;
    }
    return `<div class="tl-row ${e.kind}">
      <div class="tl-time">${toTime(e.start)}<span>${toTime(e.end)}</span></div>
      <div class="tl-dot" style="background:#cbd5e1"></div>
      <div class="tl-body"><div class="tl-title">${esc(e.label)}</div></div>
      <div class="tl-dur">${e.end - e.start} 分</div>
    </div>`;
  }).join('');

  const wk = weeklyStats(date);
  let banner = '';
  if (wk.list.length){
    const overload = wk.quizNeed > wk.avail * 0.6;
    banner = `<div class="banner ${overload ? 'warn' : 'ok'}">
      <span>${overload ? '⚠️' : '✅'}</span>
      <div>
        <b>本週測驗需求 ${fmtDur(wk.quizNeed)}</b>，放學後可用約 ${fmtDur(wk.avail)}。
        ${overload
          ? '建議將部分溫習移至週末，或優先處理高難度課題。'
          : '時間分配尚可，保持節奏即可。'}
      </div>
    </div>`;
  }

  const upcoming = state.quizzes
    .filter(q => q.status === 'planned' &&
                 daysBetween(date, q.date) >= 0 &&
                 daysBetween(date, q.date) <= 14)
    .sort((a, b) => a.date < b.date ? -1 : 1);

  const upcomingHtml = upcoming.length ? upcoming.map(q => {
    const subj = findSubject(q.subjectId);
    const d = daysBetween(date, q.date);
    const need = quizRequiredMin(q);
    const cls = d <= 3 ? 'urgent' : (d <= 7 ? 'soon' : 'later');
    return `<div class="quiz-item">
      <div class="dot" style="background:${subj ? subj.color : '#94a3b8'}"></div>
      <div class="meta">
        <div class="t">${esc(q.title || (subj ? subj.name + ' 測驗' : '測驗'))}</div>
        <div class="s">${q.date} · 需時 ${fmtDur(need)} · 平均每日 ${Math.ceil(need / Math.max(1, d))} 分</div>
      </div>
      <span class="pill ${cls}">${d === 0 ? '今日' : d + ' 天'}</span>
    </div>`;
  }).join('') : `<div class="empty">未來 14 日未有測驗</div>`;

  return `
    ${banner}
    <div class="card">
      <h2>今日總覽</h2>
      <div class="stats">
        <div class="stat"><div class="v">${fmtDur(available)}</div><div class="k">放學後可用</div></div>
        <div class="stat"><div class="v">${fmtDur(planned)}</div><div class="k">已排溫習</div></div>
        <div class="stat"><div class="v">${fmtDur(available - planned)}</div><div class="k">剩餘緩衝</div></div>
        <div class="stat"><div class="v">${upcoming.length}</div><div class="k">14 日內測驗</div></div>
      </div>
      <div class="small muted mt12">
        學校 ${state.settings.schoolStart}–${state.settings.schoolEnd} · 通勤 ${state.settings.commuteHome} 分 ·
        可溫習窗口 ${toTime(tl.freeStart)}–${toTime(tl.freeEnd)}
      </div>
    </div>

    <div class="card">
      <h2>今日時間表 <span class="badge">${WD[weekdayOf(date)]}</span></h2>
      ${rows || '<div class="empty">今日冇排到溫習，好好休息 😌</div>'}
    </div>

    <div class="card">
      <h2>未來 14 日測驗</h2>
      ${upcomingHtml}
    </div>
  `;
}

/* =========================================================
   渲染：測驗
   ========================================================= */
function viewQuizzes(){
  if (!draft) draft = newDraft();
  const subj = findSubject(draft.subjectId);

  const subjOptions = state.subjects.map(s =>
    `<option value="${s.id}" ${s.id === draft.subjectId ? 'selected' : ''}>${esc(s.name)}</option>`
  ).join('');

  let tree = '';
  if (subj){
    for (const tp of subj.topics){
      const allChecked = tp.items.length > 0 && tp.items.every(it => draft.itemIds.has(it.id));
      tree += `<div class="topic-block">
        <label class="topic-label">
          <input type="checkbox" data-quiz-topic="${tp.id}" ${allChecked ? 'checked' : ''}>
          <span>${esc(tp.name)}</span>
        </label>
        <div class="item-list">
          ${tp.items.map(it => `
            <label class="item-check">
              <input type="checkbox" data-quiz-item="${it.id}" ${draft.itemIds.has(it.id) ? 'checked' : ''}>
              <span>${esc(it.name)}</span>
              <span class="muted">剩 ${itemRemainingMin(it)} 分</span>
            </label>`).join('')}
        </div>
      </div>`;
    }
  } else {
    tree = '<div class="empty">請先在「課程樹」建立科目</div>';
  }

  const list = state.quizzes
    .filter(q => q.status !== 'cancelled')
    .slice()
    .sort((a, b) => a.date < b.date ? -1 : 1);

  const listHtml = list.length ? list.map(q => {
    const s = findSubject(q.subjectId);
    const d = daysBetween(todayStr(), q.date);
    const need = quizRequiredMin(q);
    const cls = q.status === 'done' ? 'done' : (d < 0 ? 'done' : d <= 3 ? 'urgent' : d <= 7 ? 'soon' : 'later');
    const label = q.status === 'done' ? '已完成' : (d < 0 ? '已過期' : d === 0 ? '今日' : d + ' 天');
    return `<div class="quiz-item">
      <div class="dot" style="background:${s ? s.color : '#94a3b8'}"></div>
      <div class="meta">
        <div class="t">${esc(q.title || (s ? s.name + ' 測驗' : '測驗'))}</div>
        <div class="s">${esc(s ? s.name : '？')} · ${q.date} · 需時 ${fmtDur(need)}</div>
      </div>
      <span class="pill ${cls}">${label}</span>
      <button class="danger-sm" data-action="del-quiz" data-id="${q.id}" title="刪除">✕</button>
    </div>`;
  }).join('') : '<div class="empty">尚未加入任何測驗</div>';

  return `
    <div class="card">
      <h2>新增測驗</h2>
      <div class="grid2">
        <div>
          <label class="fld">科目</label>
          <select id="q-subject">${subjOptions}</select>
        </div>
        <div>
          <label class="fld">測驗日期</label>
          <input type="date" id="q-date" value="${draft.date}">
        </div>
        <div>
          <label class="fld">名稱（可選）</label>
          <input type="text" id="q-title" value="${esc(draft.title)}" placeholder="例如 Physics Quiz – Mechanics">
        </div>
        <div>
          <label class="fld">難度自評</label>
          <div class="segmented" id="q-diff">
            <button data-d="1" class="${draft.difficulty === 1 ? 'on' : ''}">易</button>
            <button data-d="2" class="${draft.difficulty === 2 ? 'on' : ''}">中</button>
            <button data-d="3" class="${draft.difficulty === 3 ? 'on' : ''}">難</button>
          </div>
        </div>
      </div>

      <div class="mt12">
        <label class="fld">測驗範圍（直接從課程樹勾選）</label>
        ${tree}
      </div>

      <div class="preview mt12" id="q-preview">${quizPreviewHtml()}</div>

      <div class="mt12 rowflex">
        <button class="primary" id="q-add">加入測驗</button>
        <span class="small muted">勾選細項會自動帶入所屬課題</span>
      </div>
    </div>

    <div class="card">
      <h2>所有測驗 <span class="badge">${list.length}</span></h2>
      ${listHtml}
    </div>
  `;
}

function quizPreviewHtml(){
  const subj = findSubject(draft.subjectId);
  if (!subj) return '<span class="muted">請選擇科目</span>';

  const items = [];
  for (const tp of subj.topics)
    for (const it of tp.items)
      if (draft.itemIds.has(it.id)) items.push(it);

  if (!items.length) return '<span class="muted">請勾選測驗範圍</span>';

  const mult = ({1:1.0, 2:1.15, 3:1.35})[draft.difficulty] ?? 1;
  const need = Math.round(items.reduce((a, it) => a + itemRemainingMin(it) * mult, 0) / 5) * 5;
  const days = Math.max(1, daysBetween(todayStr(), draft.date));
  const perDay = Math.ceil(need / days);

  const notLearned = items.filter(it => (it.familiarity ?? 0) === 0);
  let warn = '';
  if (notLearned.length){
    warn = `<div style="margin-top:6px;color:#b45309;font-size:12.5px;">
      ⚠️ 有 ${notLearned.length} 個細項熟悉度為 0，測驗前由零開始風險較高。
    </div>`;
  }

  return `
    <div><span class="big">${fmtDur(need)}</span> <span class="muted">估算需要</span></div>
    <div>距測驗 ${days} 日 → 平均每日 ${perDay} 分鐘</div>
    <div class="muted">已選 ${items.length} 個細項</div>
    ${warn}
  `;
}

function updateQuizPreview(){
  const el = document.getElementById('q-preview');
  if (el) el.innerHTML = quizPreviewHtml();
}

/* =========================================================
   渲染：課程樹
   ========================================================= */
function viewSubjects(){
  const cards = state.subjects.map(subj => {
    const remaining = subjectRemainingMin(subj);
    const dse = daysBetween(todayStr(), subj.examDate);
    const topicsHtml = subj.topics.map(tp => `
      <div class="topic-group">
        <div class="th">${esc(tp.name)}</div>
        ${tp.items.map(it => `
          <div class="item-row">
            <div class="nm">${esc(it.name)}</div>
            <input type="number" min="0" step="10" value="${it.estMin}"
                   data-est="${it.id}" title="首次學習所需分鐘">
            <input type="range" min="0" max="100" step="5" value="${Math.round((it.familiarity || 0) * 100)}"
                   data-fam="${it.id}" title="熟悉度">
            <div class="rem" id="rem-${it.id}">剩 ${itemRemainingMin(it)} 分</div>
          </div>
        `).join('')}
      </div>
    `).join('');

    return `<div class="card">
      <div class="subj-head">
        <div class="dot" style="background:${subj.color}"></div>
        <div class="nm">${esc(subj.name)}</div>
        <div class="ex">
          剩餘 ${fmtDur(remaining)} ·
          DSE ${subj.examDate}（${dse >= 0 ? dse + ' 天' : '已過'}）
        </div>
      </div>
      ${topicsHtml}
    </div>`;
  }).join('');

  return `
    <div class="banner ok">
      <span>💡</span>
      <div>調整「預估分鐘」及「熟悉度」，系統會即時重算剩餘時間，並反映到今日計劃同測驗估算。</div>
    </div>
    ${cards}
  `;
}

/* =========================================================
   渲染：設定
   ========================================================= */
function viewSettings(){
  const s = state.settings;
  const tl = dayTimeline(todayStr());
  const freeMin = Math.max(0, tl.freeEnd - tl.freeStart);
  const weekday = WD[weekdayOf(todayStr())];

  const num = (key, label, extra = '') => `
    <div>
      <label class="fld">${label}</label>
      <input type="number" min="0" step="5" data-setting="${key}" value="${s[key]}">
      ${extra ? `<div class="small muted" style="margin-top:3px">${extra}</div>` : ''}
    </div>`;

  return `
    <div class="card">
      <h2>上學時間</h2>
      <div class="grid2">
        <div>
          <label class="fld">上學時間</label>
          <input type="time" data-setting="schoolStart" value="${s.schoolStart}">
        </div>
        <div>
          <label class="fld">放學時間</label>
          <input type="time" data-setting="schoolEnd" value="${s.schoolEnd}">
        </div>
        ${num('commuteHome', '放學通勤（分鐘）')}
        ${num('windDown', '返家緩衝（分鐘）')}
        ${num('dinner', '晚餐（分鐘）')}
        <div>
          <label class="fld">最遲溫習結束</label>
          <input type="time" data-setting="bedtime" value="${s.bedtime}">
        </div>
        <div>
          <label class="fld">週末開始時間</label>
          <input type="time" data-setting="weekendStart" value="${s.weekendStart}">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>排程參數</h2>
      <div class="grid2">
        ${num('blockMin', '每個學習區塊（分鐘）')}
        ${num('breakMin', '區塊之間休息（分鐘）')}
      </div>
      <div class="banner ok mt12">
        <span>📅</span>
        <div>今日（星期${weekday}）可用窗口 <b>${toTime(tl.freeStart)}–${toTime(tl.freeEnd)}</b>
        ＝ <b>${fmtDur(freeMin)}</b></div>
      </div>
    </div>

    <div class="card">
      <h2>資料</h2>
      <div class="rowflex">
        <button class="ghost" data-action="reset">重設為示範資料</button>
        <span class="small muted">所有資料只儲存在你的瀏覽器（localStorage）。</span>
      </div>
    </div>
  `;
}

/* =========================================================
   主渲染
   ========================================================= */
function render(){
  // header
  const now = new Date();
  $('#todayLabel').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${WD[now.getDay()]}`;

  // 最近 DSE 倒數
  let nearest = null;
  for (const s of state.subjects){
    const d = daysBetween(todayStr(), s.examDate);
    if (d >= 0 && (!nearest || d < nearest.d)) nearest = { s, d };
  }
  $('#examCountdown').textContent = nearest
    ? `DSE ${nearest.s.name} ${nearest.d} 天`
    : '未有 DSE 日期';

  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === activeTab));

  const view = $('#view');
  if (activeTab === 'today')         view.innerHTML = viewToday();
  else if (activeTab === 'quizzes')  view.innerHTML = viewQuizzes();
  else if (activeTab === 'subjects') view.innerHTML = viewSubjects();
  else                               view.innerHTML = viewSettings();

  saveState();
}

/* =========================================================
   事件
   ========================================================= */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  activeTab = b.dataset.tab;
  render();
});

const view = $('#view');

/* ---- click ---- */
view.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (btn){
    const action = btn.dataset.action;
    if (action === 'del-quiz'){
      const id = btn.dataset.id;
      state.quizzes = state.quizzes.filter(q => q.id !== id);
      render();
      return;
    }
    if (action === 'reset'){
      if (confirm('確定要重設為示範資料嗎？現有資料會清除。')){
        state = defaultState();
        draft = null;
        render();
      }
      return;
    }
  }

  // 難度 segmented
  const d = e.target.closest('#q-diff button');
  if (d){
    draft.difficulty = Number(d.dataset.d);
    document.querySelectorAll('#q-diff button').forEach(b =>
      b.classList.toggle('on', b === d));
    updateQuizPreview();
    return;
  }

  // 加入測驗
  if (e.target.id === 'q-add'){
    const subj = findSubject(draft.subjectId);
    if (!subj) return;
    if (!draft.itemIds.size){
      alert('請至少勾選一個測驗範圍細項');
      return;
    }
    const topicIds = [];
    for (const tp of subj.topics)
      if (tp.items.some(it => draft.itemIds.has(it.id))) topicIds.push(tp.id);

    state.quizzes.push({
      id: 'q' + Date.now(),
      subjectId: draft.subjectId,
      date: draft.date,
      title: draft.title.trim() ||
             (subj.name + ' Quiz – ' +
              (subj.topics.find(t => t.id === topicIds[0])?.name || '')),
      difficulty: draft.difficulty,
      status: 'planned',
      topicIds,
      itemIds: [...draft.itemIds]
    });
    draft = newDraft();
    render();
    return;
  }
});

/* ---- change ---- */
view.addEventListener('change', e => {
  const t = e.target;

  // 測驗表單：科目
  if (t.id === 'q-subject'){
    draft.subjectId = t.value;
    draft.itemIds = new Set();
    render();
    return;
  }
  // 測驗表單：日期
  if (t.id === 'q-date'){
    draft.date = t.value;
    updateQuizPreview();
    return;
  }
  // 測驗表單：課題 checkbox
  if (t.matches('[data-quiz-topic]')){
    const subj = findSubject(draft.subjectId);
    const tp = subj.topics.find(x => x.id === t.dataset.quizTopic);
    if (!tp) return;
    if (t.checked) tp.items.forEach(it => draft.itemIds.add(it.id));
    else           tp.items.forEach(it => draft.itemIds.delete(it.id));
    render();
    return;
  }
  // 測驗表單：細項 checkbox
  if (t.matches('[data-quiz-item]')){
    const id = t.dataset.quizItem;
    if (t.checked) draft.itemIds.add(id);
    else           draft.itemIds.delete(id);

    // 同步課題 checkbox 視覺狀態
    const subj = findSubject(draft.subjectId);
    const tp = subj.topics.find(x => x.items.some(it => it.id === id));
    if (tp){
      const all = tp.items.every(it => draft.itemIds.has(it.id));
      const cb = view.querySelector(`[data-quiz-topic="${tp.id}"]`);
      if (cb) cb.checked = all;
    }
    updateQuizPreview();
    return;
  }

  // 設定
  if (t.dataset.setting){
    const key = t.dataset.setting;
    state.settings[key] = t.type === 'number' ? Number(t.value) : t.value;
    render();
    return;
  }

  // 課程樹：預估分鐘
  if (t.dataset.est){
    const id = t.dataset.est;
    for (const subj of state.subjects)
      for (const tp of subj.topics)
        for (const it of tp.items)
          if (it.id === id) it.estMin = Math.max(0, Number(t.value) || 0);
    render();
    return;
  }
});

/* ---- input（即時，不重繪） ---- */
view.addEventListener('input', e => {
  const t = e.target;

  // 測驗名稱
  if (t.id === 'q-title'){
    draft.title = t.value;
    return;
  }

  // 熟悉度 slider
  if (t.dataset.fam){
    const id = t.dataset.fam;
    for (const subj of state.subjects)
      for (const tp of subj.topics)
        for (const it of tp.items)
          if (it.id === id) it.familiarity = Number(t.value) / 100;
    const remEl = document.getElementById('rem-' + id);
    if (remEl){
      for (const subj of state.subjects)
        for (const tp of subj.topics)
          for (const it of tp.items)
            if (it.id === id) remEl.textContent = '剩 ' + itemRemainingMin(it) + ' 分';
    }
    return;
  }

  // 預估分鐘（即時更新剩餘顯示）
  if (t.dataset.est){
    const id = t.dataset.est;
    for (const subj of state.subjects)
      for (const tp of subj.topics)
        for (const it of tp.items)
          if (it.id === id) it.estMin = Math.max(0, Number(t.value) || 0);
    const remEl = document.getElementById('rem-' + id);
    if (remEl){
      for (const subj of state.subjects)
        for (const tp of subj.topics)
          for (const it of tp.items)
            if (it.id === id) remEl.textContent = '剩 ' + itemRemainingMin(it) + ' 分';
    }
    return;
  }
});

/* =========================================================
   啟動
   ========================================================= */
render();
</script>
</body>
</html>
